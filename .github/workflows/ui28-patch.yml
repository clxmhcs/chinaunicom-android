name: UI28 Route Patch

on:
  push:
    branches:
      - ui-28-balance-grouping-ios-refinement
    paths:
      - .github/workflows/ui28-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-28-balance-grouping-ios-refinement
          fetch-depth: 0
      - name: Patch route
        run: python3 .github/scripts/ui28_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m "UI-28: route balance grouping to refined screen"
          git push origin HEAD:ui-28-balance-grouping-ios-refinement
