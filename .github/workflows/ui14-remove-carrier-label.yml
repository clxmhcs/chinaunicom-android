name: UI14 Remove Carrier Label Patch

on:
  push:
    branches:
      - ui-14-remove-carrier-label
    paths:
      - scripts/ui14_remove_carrier_label.py
      - .github/workflows/ui14-remove-carrier-label.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-14-remove-carrier-label

      - name: Apply patch
        run: python3 scripts/ui14_remove_carrier_label.py

      - name: Verify
        run: |
          FILE=app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -F '.removePrefix("联通号码")' "$FILE"

      - name: Commit app source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          git commit -m 'UI-14: remove carrier label after mobile'
          git push origin HEAD:ui-14-remove-carrier-label
