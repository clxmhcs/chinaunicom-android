name: UI19 Voice Display Settings Parity Patch
on:
  push:
    branches: [ui-19-voice-display-settings-parity]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-19-voice-display-settings-parity
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/ui19_voice_display_settings_patch.py
      - name: Verify
        run: |
          grep -q 'private fun VoiceCandidateGlyph' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -q 'fontSize = 10.29.sp' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -q 'size(28.dp)' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
      - name: Commit app source change
        run: |
          rm scripts/ui19_voice_display_settings_patch.py
          rm .github/workflows/ui19-voice-display-settings-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UI-19: refine voice display settings parity'
          git push origin HEAD:ui-19-voice-display-settings-parity
