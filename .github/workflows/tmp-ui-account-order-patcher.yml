name: Temporary UI Account Order Patcher

on:
  push:
    branches:
      - ui-25-account-order-refinement

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-order-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-25-account-order-refinement
          fetch-depth: 0
      - name: Patch custom account ordering UI
        run: python3 tools/tmp_patch_account_order.py
      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R.drawable.receipt_sim_card_icon' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          grep -q 'detectVerticalDragGestures' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          grep -q 'locationForNumber = m11cViewModel::cachedLocation' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          grep -q '按住右侧拖动按钮调整顺序' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          ! grep -A45 'private fun IosAccountOrderScreen' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt | grep -q 'Text("上移")'
          git diff --check
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          git commit -m '[ui-order-patched] UI-25 refine custom account ordering'
          git push origin HEAD:ui-25-account-order-refinement
