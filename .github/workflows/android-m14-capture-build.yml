name: Android M14 Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "capture/**"
      - "app/**"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-m14-capture-build.yml"
  push:
    branches: [main]
    paths:
      - "capture/**"
      - "app/**"
      - "settings.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-m14-capture-build.yml"

permissions:
  contents: read

jobs:
  m14-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M14 capture authority boundary
        shell: bash
        run: |
          ROOT=settings.gradle.kts
          APP_BUILD=app/build.gradle.kts
          CAPTURE_BUILD=capture/build.gradle.kts
          MANIFEST=capture/src/main/AndroidManifest.xml
          MODELS=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureModels.kt
          PACKET_MODELS=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CapturePacketModels.kt
          DECODER=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureIpPacketDecoder.kt
          TCP_DECODER=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureTcpSegmentDecoder.kt
          HTTP_PIPELINE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureHttpStreamPipeline.kt
          TLS_ARCH=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureTlsArchitecture.kt
          TLS_STORE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureTlsConfigurationStore.kt
          CERT_LIFECYCLE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureCertificateLifecycle.kt
          MITM_COORD=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureMitmProxyCoordinator.kt
          HISTORY=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureHistoryStore.kt
          HAR_EXPORT=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureHarExporter.kt
          UI_FACADE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureToolFacade.kt
          READER=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureTunPacketReader.kt
          STORE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureRuntimeStore.kt
          CONTROLLER=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureVpnController.kt
          SERVICE=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureVpnService.kt
          PROXY_SERVER=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureLocalProxyServer.kt
          PROXY_RUNTIME=capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureProxyHttpRuntime.kt
          APP_UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/CaptureToolScreen.kt
          OTHER_UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          CONFIG_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureConfigurationTest.kt
          DECODER_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureIpPacketDecoderTest.kt
          RUNTIME_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CapturePacketRuntimeTest.kt
          TCP_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureTcpSegmentDecoderTest.kt
          HTTP_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureHttpStreamPipelineTest.kt
          TLS_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureTlsArchitectureTest.kt
          HAR_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureHarExporterTest.kt
          PROXY_TEST=capture/src/test/java/com/clxmhcs/chinaunicom/capture/CaptureLocalProxyServerTest.kt
          DOC=docs/migration/M14_CAPTURE_ARCHITECTURE.md

          for file in "$ROOT" "$APP_BUILD" "$CAPTURE_BUILD" "$MANIFEST" "$MODELS" "$PACKET_MODELS" "$DECODER" "$TCP_DECODER" "$HTTP_PIPELINE" "$TLS_ARCH" "$TLS_STORE" "$CERT_LIFECYCLE" "$MITM_COORD" "$HISTORY" "$HAR_EXPORT" "$UI_FACADE" "$READER" "$STORE" "$CONTROLLER" "$SERVICE" "$PROXY_SERVER" "$PROXY_RUNTIME" "$APP_UI" "$OTHER_UI" "$CONFIG_TEST" "$DECODER_TEST" "$RUNTIME_TEST" "$TCP_TEST" "$HTTP_TEST" "$TLS_TEST" "$HAR_TEST" "$PROXY_TEST" "$DOC"; do test -f "$file"; done

          grep -q 'include(":capture")' "$ROOT"
          grep -q 'implementation(project(":capture"))' "$APP_BUILD"
          grep -q 'm14f1' "$APP_BUILD"
          grep -q 'minSdk = 30' "$CAPTURE_BUILD"

          grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_SYSTEM_EXEMPTED' "$MANIFEST"
          grep -q 'android.permission.BIND_VPN_SERVICE' "$MANIFEST"
          grep -q 'android:exported="false"' "$MANIFEST"
          grep -q 'android:foregroundServiceType="systemExempted"' "$MANIFEST"
          grep -q 'android.net.VpnService' "$MANIFEST"

          grep -q 'VpnService.prepare' "$CONTROLLER"
          grep -q 'startForegroundService' "$CONTROLLER"
          grep -q 'CaptureProxyHttpRuntime.snapshot' "$CONTROLLER"
          grep -q 'CaptureProxyHttpRuntime.recentMessages' "$CONTROLLER"

          grep -q 'class CaptureVpnService : VpnService()' "$SERVICE"
          grep -q 'CaptureTunPacketReader' "$SERVICE"
          grep -q 'CaptureLocalProxyServer' "$SERVICE"
          grep -q 'CapturePacketRuntime.beginSession' "$SERVICE"
          grep -q 'CaptureHttpRuntime.beginSession' "$SERVICE"
          grep -q 'CaptureProxyHttpRuntime.beginSession' "$SERVICE"
          grep -q 'setMtu(MTU)' "$SERVICE"
          grep -q 'addAddress(TUN_ADDRESS, TUN_PREFIX_LENGTH)' "$SERVICE"
          grep -q 'addRoute(SAFE_ROUTE_ADDRESS, SAFE_ROUTE_PREFIX_LENGTH)' "$SERVICE"
          grep -q 'SAFE_ROUTE_ADDRESS = "192.0.2.0"' "$SERVICE"
          grep -q 'SAFE_ROUTE_PREFIX_LENGTH = 24' "$SERVICE"
          grep -q 'ProxyInfo.buildDirectProxy' "$SERVICE"
          grep -q 'setHttpProxy' "$SERVICE"
          grep -q 'LOCAL_PROXY_HOST = CaptureLocalProxyServer.BIND_HOST' "$SERVICE"
          grep -q 'LOCAL_PROXY_PORT = CaptureLocalProxyServer.DEFAULT_PORT' "$SERVICE"
          grep -q 'setBlocking(false)' "$SERVICE"
          grep -q 'onRevoke' "$SERVICE"
          grep -q 'START_NOT_STICKY' "$SERVICE"
          ! grep -Eqi 'CaptureMitm|CaptureTls|CaptureCertificate|SSLSocket|SSLContext' "$SERVICE"

          grep -q 'Os.read' "$READER"
          grep -q 'ParcelFileDescriptor.dup' "$READER"
          grep -q 'CaptureIpPacketDecoder.decode' "$READER"
          grep -q 'CaptureTcpSegmentDecoder.decode' "$READER"
          grep -q 'RECENT_PACKET_LIMIT = 128' "$PACKET_MODELS"
          grep -q 'CaptureIpVersion.IPV4' "$DECODER"
          grep -q 'CaptureIpVersion.IPV6' "$DECODER"

          grep -q 'class CaptureHttpStreamPipeline' "$HTTP_PIPELINE"
          grep -q 'MAX_STREAMS = 64' "$HTTP_PIPELINE"
          grep -q 'MAX_STREAM_BYTES = 64 \* 1024' "$HTTP_PIPELINE"
          grep -q 'RECENT_MESSAGE_LIMIT = 128' "$HTTP_PIPELINE"
          grep -q 'REDACTED = "\[REDACTED\]"' "$HTTP_PIPELINE"
          grep -q '"authorization"' "$HTTP_PIPELINE"
          grep -q '"cookie"' "$HTTP_PIPELINE"
          grep -q '"set-cookie"' "$HTTP_PIPELINE"
          ! grep -q 'val body:' "$HTTP_PIPELINE"

          grep -q 'HOST_CERTIFICATE_GENERATION_AVAILABLE: Boolean = false' "$TLS_ARCH"
          grep -q 'ACTIVE_TLS_DECRYPTION_AVAILABLE: Boolean = false' "$TLS_ARCH"
          grep -q 'return null' "$CERT_LIFECYCLE"
          grep -q '!hostCertificateGenerationAvailable' "$MITM_COORD"
          grep -q '!activeTlsDecryptionAvailable' "$MITM_COORD"
          ! grep -q 'KeyChain.createInstallIntent' "$CERT_LIFECYCLE"

          grep -q 'class CaptureLocalProxyServer' "$PROXY_SERVER"
          grep -q 'BIND_HOST = "127.0.0.1"' "$PROXY_SERVER"
          grep -q 'DEFAULT_PORT = 9090' "$PROXY_SERVER"
          grep -q 'vpnService.protect(socket)' "$PROXY_SERVER"
          grep -q 'CONNECT_ESTABLISHED_BYTES' "$PROXY_SERVER"
          grep -q 'CaptureProxyRequestParser.rewriteForOrigin' "$PROXY_SERVER"
          grep -q 'Proxy-Authorization' "$PROXY_SERVER"
          grep -q 'CaptureHttpHeaderParser.parse' "$PROXY_SERVER"
          grep -q 'MAX_QUEUED_CONNECTIONS = 64' "$PROXY_SERVER"
          grep -q 'object CaptureProxyFilter' "$PROXY_SERVER"
          grep -q 'object CaptureProxyHttpRuntime' "$PROXY_RUNTIME"
          grep -q 'RECENT_MESSAGE_LIMIT = 128' "$PROXY_RUNTIME"
          ! grep -Eqi 'FileOutputStream|openFileOutput|SharedPreferences|SQLite|RoomDatabase|requestBody|responseBody|postData' "$PROXY_SERVER" "$PROXY_RUNTIME"
          ! grep -Eqi 'SSLSocket|SSLContext|TrustManager|KeyManager|KeyPairGenerator|PrivateKey|X509v3CertificateBuilder|BouncyCastle' "$PROXY_SERVER" "$PROXY_RUNTIME"

          grep -q 'CaptureProxyHttpRuntime.recentMessages' "$HISTORY"
          grep -q 'MAX_VISIBLE_RECORDS = 128' "$HISTORY"
          ! grep -Eqi 'SharedPreferences|SQLite|RoomDatabase|FileOutputStream|openFileOutput|java\.io\.File' "$HISTORY"

          grep -q 'object CaptureHarExporter' "$HAR_EXPORT"
          grep -q '_captureMessageKind' "$HAR_EXPORT"
          grep -q '_captureStreamId' "$HAR_EXPORT"
          ! grep -Eqi 'postData|requestBody|responseBody|FileOutputStream|openFileOutput|SQLite|RoomDatabase|SharedPreferences' "$HAR_EXPORT"

          grep -q 'fun CaptureToolScreen' "$APP_UI"
          grep -q 'CaptureVpnController.permissionIntent' "$APP_UI"
          grep -q 'CaptureVpnController.start' "$APP_UI"
          grep -q 'CaptureVpnController.stop' "$APP_UI"
          grep -q 'CaptureToolScreen' "$OTHER_UI"

          grep -q 'parsesAbsoluteHttpTargetAndRewritesForOrigin' "$PROXY_TEST"
          grep -q 'parsesConnectAuthorityWithoutInspectingTlsPayload' "$PROXY_TEST"
          grep -q 'pathFilterDoesNotPretendConnectHasDecryptedPath' "$PROXY_TEST"
          grep -q 'M14-F — source-parity local HTTP/HTTPS proxy forwarding' "$DOC"
          grep -q 'VpnService.Builder.setHttpProxy' "$DOC"
          grep -q 'proxy recommendation' "$DOC"
          grep -q 'decrypted-capture device acceptance skipped by user' "$DOC"

          ! grep -Eq '0\.0\.0\.0|::/0|addRoute\([^,]+,[[:space:]]*0\)' "$SERVICE"
          ! grep -Eqi 'okhttp3|SSLSocket|SSLContext|TrustManager|KeyManager|KeyPairGenerator|PrivateKey|X509v3CertificateBuilder|BouncyCastle|HARWriter' capture/src/main/java
          ! grep -Eqi 'SharedPreferences|FileOutputStream|openFileOutput|SQLite|RoomDatabase' "$PACKET_MODELS" "$DECODER" "$TCP_DECODER" "$HTTP_PIPELINE" "$READER" "$HISTORY" "$HAR_EXPORT" "$PROXY_RUNTIME"
          ! grep -Eqi 'token_online|idcardlastsix|ecstest2018|m\.client\.10010\.com|m\.10155\.com|UnicomAPIClient|LoginQuotaRefreshClient' capture/src/main/java

          echo "M14_CAPTURE_BOUNDARY=PASS"

      - name: Run M14 capture regression
        run: >-
          gradle
          :capture:testDebugUnitTest
          :capture:assembleDebug
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace
