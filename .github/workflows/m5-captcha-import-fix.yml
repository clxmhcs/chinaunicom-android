name: Fix M5 Captcha Import

on:
  push:
    branches:
      - m5-sms-captcha-webview-parity
    paths:
      - .github/workflows/m5-captcha-import-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-sms-captcha-webview-parity
      - name: Add missing weight import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/UnicomCaptchaVerificationDialog.kt')
          s = p.read_text()
          needle = 'import androidx.compose.foundation.layout.width\n'
          repl = needle + 'import androidx.compose.foundation.layout.weight\n'
          assert needle in s and 'import androidx.compose.foundation.layout.weight\n' not in s
          p.write_text(s.replace(needle, repl, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/UnicomCaptchaVerificationDialog.kt
          git commit -m "M5: fix captcha Compose layout import"
          git push origin HEAD:m5-sms-captcha-webview-parity
