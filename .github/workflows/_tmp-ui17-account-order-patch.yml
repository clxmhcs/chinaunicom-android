name: TEMP UI17 account order patch
on:
  push:
    branches: [ui-17-account-order-ios-refinement]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-17-account-order-ios-refinement
      - name: Patch entry
        run: |
          sed -i '0,/IosAccountOrderScreen(/s//IosAccountOrderRefinedScreen(/' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          grep -q 'IosAccountOrderRefinedScreen(' app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt
          git commit -m 'UI-17: route custom order to refined iOS screen'
          git push origin HEAD:ui-17-account-order-ios-refinement
