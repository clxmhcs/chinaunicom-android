name: UI11 Flow Card Spacing Patch

on:
  push:
    branches:
      - ui-11-flow-card-spacing-tuning
    paths:
      - scripts/ui11_flow_spacing.py
      - .github/workflows/ui11-flow-spacing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-11-flow-card-spacing-tuning

      - name: Apply exact spacing patch
        run: python3 scripts/ui11_flow_spacing.py

      - name: Verify intended values only
        run: |
          grep -F 'top = 15.2.dp,' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -F 'verticalArrangement = Arrangement.spacedBy(14.1667.dp),' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt

      - name: Commit app source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          git commit -m 'UI-11: tighten flow card vertical spacing'
          git push origin HEAD:ui-11-flow-card-spacing-tuning
