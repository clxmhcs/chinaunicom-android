name: UI-30 Apply Account Icons

on:
  push:
    branches:
      - ui-30-account-action-icon-refinement
    paths:
      - scripts/ui30_refine_account_icons.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-30-account-action-icon-refinement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply icon refinement
        run: python scripts/ui30_refine_account_icons.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsAccountScreen.kt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "UI-30: refine account action icons to iOS screenshot"
          git push origin HEAD:ui-30-account-action-icon-refinement
