name: UI14 Apply Settings Screen

on:
  push:
    branches:
      - ui-14-settings-ios-refinement
    paths:
      - ".github/workflows/ui14-apply-settings-screen.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-14-settings-ios-refinement
          fetch-depth: 0

      - name: Switch settings root to iOS-parity screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt')
          text = path.read_text()
          old = '''                composable(RootTab.Settings.route) {
                    SettingsRootScreen(
                        settingsViewModel = settingsViewModel,'''
          new = '''                composable(RootTab.Settings.route) {
                    SettingsRootVisualScreen(
                        settingsViewModel = settingsViewModel,'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one settings root anchor, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/ui14-apply-settings-screen.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt .github/workflows/ui14-apply-settings-screen.yml
          git commit -m "UI-14: route settings tab to iOS-parity screen"
          git push origin HEAD:ui-14-settings-ios-refinement
