name: Android M8 Comprehensive Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M8_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m8-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M8_BASELINE.md"
      - ".github/workflows/android-m8-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  comprehensive-business-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M8-C phone bill client cache store boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/PhoneBillModels.kt
          NETWORK_CONTRACT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/ComprehensiveBusinessNetworkContracts.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPhoneBillClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/PhoneBillAccountCredentialLifecycle.kt
          CACHE=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/AndroidPhoneBillDiskCache.kt
          SHARING=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/PhoneBillHistoricalSharing.kt
          STORE=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/PhoneBillStore.kt
          FACTORY=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/AndroidPhoneBillStores.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          test -f "$MODEL"
          test -f "$NETWORK_CONTRACT"
          test -f "$CLIENT"
          test -f "$LIFECYCLE"
          test -f "$CACHE"
          test -f "$SHARING"
          test -f "$STORE"
          test -f "$FACTORY"
          grep -q 'include(":data:orderedbusiness")' settings.gradle.kts
          grep -q 'include(":data:phonebill")' settings.gradle.kts

          grep -q 'CURRENT_PARSER_VERSION = 4' "$MODEL"
          grep -q 'm.client.10010.com' "$NETWORK_CONTRACT"
          grep -q 'serviceimportantbusiness/phoneBillNew/queryMonths' "$NETWORK_CONTRACT"
          grep -q 'serviceimportantbusiness/phoneBillNew/queryDetail' "$NETWORK_CONTRACT"

          grep -q 'OkHttpUnicomTransport(20_000L)' "$CLIENT"
          grep -q 'iphone_c@9.0100' "$CLIENT"
          grep -q 'ticketChannel' "$CLIENT"
          grep -q 'PhoneBillSnapshot.CURRENT_PARSER_VERSION' "$CLIENT"
          grep -q 'fetchMonthsOnce(activated.cookie)' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"

          grep -q 'credentialStore.read(accountID)' "$LIFECYCLE"
          grep -q 'credentialStore.save(accountID, it)' "$LIFECYCLE"
          grep -q 'copy(updatedCredentials = null)' "$LIFECYCLE"

          grep -q 'AtomicFile' "$CACHE"
          grep -q 'phone-bill-snapshots.json' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          grep -q 'VISIBLE_MONTH_COUNT = 13' "$CACHE"
          grep -q 'currentMonthCacheMinutes' "$CACHE"
          grep -q 'historicalCacheDays' "$CACHE"
          grep -q 'monthlyRecheckDay' "$CACHE"
          ! grep -Eiq 'cookie|token_online|appid|password|verificationcode|resulttoken' "$CACHE"

          grep -q 'snapshotBelongsToAccount' "$SHARING"
          grep -q 'withMonthLock' "$SHARING"
          grep -q 'reuseSharedCacheBeforeNetwork' "$STORE"
          grep -q 'refreshSelectedMonth' "$STORE"
          grep -q 'DefaultPhoneBillStore' "$FACTORY"

          grep -q 'currentMonthCacheMinutes: Int = 10' "$SETTINGS"
          grep -q 'historicalCacheDays: Int = 15' "$SETTINGS"
          grep -q 'monthlyRecheckDay: Int = 2' "$SETTINGS"
          grep -q 'monthlyRecheckHour: Int = 8' "$SETTINGS"

          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'minSdk = 30' data/orderedbusiness/build.gradle.kts
          grep -q 'minSdk = 30' data/phonebill/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "M8_C_PHONE_BILL_GATE=PASS"

      - name: Run M8-C regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M8-C status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m8-phone-bill',
              description: passed ? 'M8-C phone bill gate passed' : 'M8-C phone bill regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M8-C verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
