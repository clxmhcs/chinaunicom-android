name: Android M8 Comprehensive Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M8_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m8-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M8_BASELINE.md"
      - ".github/workflows/android-m8-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  comprehensive-business-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M8-B ordered business client cache store boundary
        shell: bash
        run: |
          ORDERED_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/OrderedBusinessModels.kt
          NETWORK_CONTRACT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/ComprehensiveBusinessNetworkContracts.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomOrderedBusinessClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/OrderedBusinessAccountCredentialLifecycle.kt
          STORE=data/orderedbusiness/src/main/kotlin/com/clxmhcs/chinaunicom/data/orderedbusiness/OrderedBusinessStore.kt
          CACHE=data/orderedbusiness/src/main/kotlin/com/clxmhcs/chinaunicom/data/orderedbusiness/AndroidOrderedBusinessDiskCache.kt
          FACTORY=data/orderedbusiness/src/main/kotlin/com/clxmhcs/chinaunicom/data/orderedbusiness/AndroidOrderedBusinessStores.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          test -f "$ORDERED_MODEL"
          test -f "$NETWORK_CONTRACT"
          test -f "$CLIENT"
          test -f "$LIFECYCLE"
          test -f "$STORE"
          test -f "$CACHE"
          test -f "$FACTORY"
          grep -q 'include(":data:orderedbusiness")' settings.gradle.kts

          grep -q 'mxx.client.10010.com' "$NETWORK_CONTRACT"
          grep -q 'loginxx.10010.com/mobileService/onLine.htm' "$NETWORK_CONTRACT"
          grep -q 'servicebusiness/newOrdered/provincialAlloc' "$NETWORK_CONTRACT"
          grep -q 'servicebusiness/newOrdered/queryOrderRelationship' "$NETWORK_CONTRACT"

          grep -q 'OkHttpUnicomTransport(20_000L)' "$CLIENT"
          grep -q 'iphone_c@12.1300' "$CLIENT"
          grep -q 'Origin.*imgxx.client.10010.com' "$CLIENT"
          grep -q '已订业务 loginxx 会话恢复成功，但业务会话仍未建立' "$CLIENT"
          grep -q 'credentialsChanged\|val changed' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"

          grep -q 'credentialStore.read(accountID)' "$LIFECYCLE"
          grep -q 'credentialStore.save(accountID, it)' "$LIFECYCLE"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"

          grep -q 'AtomicFile' "$CACHE"
          grep -q 'ordered-business-snapshots.json' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          ! grep -Eiq 'cookie|token_online|appid|password|verificationcode|resulttoken' "$CACHE"

          grep -q 'CACHE_PREFERRED' "$STORE"
          grep -q 'REFRESH_WHEN_EXPIRED' "$STORE"
          grep -q 'EVERY_ENTRY' "$STORE"
          grep -q 'MANUAL_ONLY' "$STORE"
          grep -q 'refreshAllAccountGapSeconds' "$STORE"
          grep -q '查询成功，但本地保存失败' "$STORE"
          grep -q 'DefaultOrderedBusinessStore' "$FACTORY"

          grep -q 'cacheValidityHours: Int = 12' "$SETTINGS"
          grep -q 'noCacheAutoQuery: Boolean = false' "$SETTINGS"
          grep -q 'refreshAllAccountGapSeconds: Int = 1' "$SETTINGS"

          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'minSdk = 30' data/orderedbusiness/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "M8_B_ORDERED_BUSINESS_GATE=PASS"

      - name: Run M8-B regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M8-B status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m8-ordered-business',
              description: passed ? 'M8-B ordered business gate passed' : 'M8-B ordered business regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M8-B verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
