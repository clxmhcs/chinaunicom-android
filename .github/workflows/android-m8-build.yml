name: Android M8 Comprehensive Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M8_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m8-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M8_BASELINE.md"
      - ".github/workflows/android-m8-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  comprehensive-business-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M8-D integral client cache store boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/IntegralModels.kt
          NETWORK_CONTRACT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/ComprehensiveBusinessNetworkContracts.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomIntegralClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/IntegralAccountCredentialLifecycle.kt
          CACHE=data/integral/src/main/kotlin/com/clxmhcs/chinaunicom/data/integral/AndroidIntegralDiskCache.kt
          STORE=data/integral/src/main/kotlin/com/clxmhcs/chinaunicom/data/integral/IntegralStore.kt
          FACTORY=data/integral/src/main/kotlin/com/clxmhcs/chinaunicom/data/integral/AndroidIntegralStores.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          test -f "$MODEL"
          test -f "$NETWORK_CONTRACT"
          test -f "$CLIENT"
          test -f "$LIFECYCLE"
          test -f "$CACHE"
          test -f "$STORE"
          test -f "$FACTORY"
          grep -q 'include(":data:orderedbusiness")' settings.gradle.kts
          grep -q 'include(":data:phonebill")' settings.gradle.kts
          grep -q 'include(":data:integral")' settings.gradle.kts

          grep -q 'CURRENT_PARSER_VERSION = 1' "$MODEL"
          grep -q 'activity.10010.com' "$NETWORK_CONTRACT"
          grep -q 'welfare-mall-front/mobile/show/bj2205/v2/1' "$NETWORK_CONTRACT"
          grep -q 'new/integral/queryMonthlyList/v1' "$NETWORK_CONTRACT"
          grep -q 'new/integral/querySummaryList/v1' "$NETWORK_CONTRACT"
          grep -q 'ZXGS97000017640,003' "$NETWORK_CONTRACT"

          grep -q 'OkHttpUnicomTransport(20_000L)' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q 'c_mobile' "$CLIENT"
          grep -q 'u_account' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"
          grep -q 'IntegralSnapshot.CURRENT_PARSER_VERSION' "$CLIENT"
          grep -q 'INTEGRAL_SOURCE' "$CLIENT"

          grep -q 'credentialStore.read(accountID)' "$LIFECYCLE"
          grep -q 'credentialStore.save(accountID, it)' "$LIFECYCLE"
          grep -q 'copy(updatedCredentials = null)' "$LIFECYCLE"

          grep -q 'AtomicFile' "$CACHE"
          grep -q 'integral-snapshots.json' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          grep -q 'refreshCycleKey' "$CACHE"
          grep -q 'monthlyRefreshDay' "$CACHE"
          grep -q 'monthlyRefreshHour' "$CACHE"
          grep -q 'fixedIntervalHours' "$CACHE"
          grep -q 'MANUAL_ONLY' "$CACHE"
          ! grep -Eiq 'cookie|token_online|password|verificationcode|resulttoken' "$CACHE"

          grep -q 'ManualRequired' "$STORE"
          grep -q 'details = emptyMap()' "$STORE"
          grep -q 'loadDetails' "$STORE"
          grep -q 'manualRefresh' "$STORE"
          grep -q 'DefaultIntegralStore' "$FACTORY"

          grep -q 'automaticRefreshEnabled: Boolean = true' "$SETTINGS"
          grep -q 'cycleMode: IntegralRefreshCycleMode = IntegralRefreshCycleMode.MONTHLY' "$SETTINGS"
          grep -q 'monthlyRefreshDay: Int = 2' "$SETTINGS"
          grep -q 'monthlyRefreshHour: Int = 8' "$SETTINGS"
          grep -q 'fixedIntervalHours: Int = 24' "$SETTINGS"
          grep -q 'checkOnEntry: Boolean = true' "$SETTINGS"

          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'minSdk = 30' data/orderedbusiness/build.gradle.kts
          grep -q 'minSdk = 30' data/phonebill/build.gradle.kts
          grep -q 'minSdk = 30' data/integral/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "M8_D_INTEGRAL_GATE=PASS"

      - name: Run M8-D regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :data:integral:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M8-D status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m8-integral',
              description: passed ? 'M8-D integral gate passed' : 'M8-D integral regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M8-D verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
