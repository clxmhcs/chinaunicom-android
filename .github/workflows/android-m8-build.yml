name: Android M8 Comprehensive Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M8_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m8-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M8_BASELINE.md"
      - ".github/workflows/android-m8-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  comprehensive-business-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M8-E1 comprehensive root aggregation and entries boundary
        shell: bash
        run: |
          STORE=data/comprehensive/src/main/kotlin/com/clxmhcs/chinaunicom/data/comprehensive/ComprehensiveBusinessStore.kt
          SCREEN=app/src/main/java/com/clxmhcs/chinaunicom/ui/ComprehensiveBusinessScreen.kt
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/ComprehensiveBusinessViewModel.kt
          ROOT=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          FLOW_VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt

          test -f "$STORE"
          test -f "$SCREEN"
          test -f "$VM"
          test -f "$ROOT"
          grep -q 'include(":data:integral")' settings.gradle.kts
          grep -q 'include(":data:comprehensive")' settings.gradle.kts
          grep -q 'implementation(project(":data:orderedbusiness"))' app/build.gradle.kts
          grep -q 'implementation(project(":data:phonebill"))' app/build.gradle.kts
          grep -q 'implementation(project(":data:integral"))' app/build.gradle.kts
          grep -q 'implementation(project(":data:comprehensive"))' app/build.gradle.kts

          grep -q 'integralCache.snapshots(accountIDs)' "$STORE"
          grep -q 'requestSequence' "$STORE"
          ! grep -Eq 'core\.network|UnicomHTTPClient|NetworkClient|CredentialStore' "$STORE"

          grep -q '本页面不会主动联网刷新' "$SCREEN"
          grep -q 'loadCachedPoints(accountIDs)' "$SCREEN"
          grep -q 'financialRepresentativeAccountID(account.id)' "$SCREEN"
          grep -q 'loadOrderedBusiness(account)' "$SCREEN"
          grep -q 'loadPhoneBill(account)' "$SCREEN"
          grep -q 'remainingQuerySnapshot == null' "$SCREEN"
          grep -q 'loadIntegral(account)' "$SCREEN"
          grep -q 'IntegralDetailQuery.month' "$SCREEN"

          ROOT_SECTION="$(awk '/fun ComprehensiveBusinessScreen\(/,/^private fun ComprehensiveAccountCard\(/' "$SCREEN")"
          echo "$ROOT_SECTION" | grep -q 'loadCachedPoints'
          ! echo "$ROOT_SECTION" | grep -Eq 'refresh(Account|All|Integral|Ordered|Phone)|loadOrderedBusiness|loadPhoneBill|loadIntegral'

          grep -q 'OrderedBusinessAccountCredentialLifecycle' "$VM"
          grep -q 'PhoneBillAccountCredentialLifecycle' "$VM"
          grep -q 'IntegralAccountCredentialLifecycle' "$VM"
          grep -q 'CredentialStoreProvider.create' "$VM"
          grep -q 'financialRepresentativeAccountID' "$FLOW_VM"

          grep -q 'ComprehensiveBusinessScreen' "$ROOT"
          ! grep -q 'ComprehensiveBusinessPlaceholder()' "$ROOT"
          grep -q 'comprehensive/ordered/' "$ROOT"
          grep -q 'comprehensive/bill/' "$ROOT"
          grep -q 'comprehensive/flow/' "$ROOT"
          grep -q 'comprehensive/voice/' "$ROOT"
          grep -q 'comprehensive/integral/' "$ROOT"

          grep -q 'versionName = "0.8.0-m8e1"' app/build.gradle.kts
          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'minSdk = 30' data/comprehensive/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "M8_E1_COMPREHENSIVE_ROOT_GATE=PASS"

      - name: Run M8-E1 regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :data:integral:testDebugUnitTest
          :data:comprehensive:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M8-E1 status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m8-comprehensive-root',
              description: passed ? 'M8-E1 comprehensive root gate passed' : 'M8-E1 comprehensive root regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M8-E1 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
