name: Android M8 Comprehensive Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M8_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m8-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M8_BASELINE.md"
      - ".github/workflows/android-m8-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  comprehensive-business-foundation-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M8-A model policy network foundation
        shell: bash
        run: |
          ORDERED_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/OrderedBusinessModels.kt
          BILL_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/PhoneBillModels.kt
          INTEGRAL_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/IntegralModels.kt
          NETWORK=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/ComprehensiveBusinessNetworkContracts.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          test -f "$ORDERED_MODEL"
          test -f "$BILL_MODEL"
          test -f "$INTEGRAL_MODEL"
          test -f "$NETWORK"
          test ! -f core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/ComprehensiveBusinessModels.kt

          grep -q 'data class OrderedBusinessSnapshot' "$ORDERED_MODEL"
          grep -q 'val totalCount: Int get() = sections.sumOf' "$ORDERED_MODEL"
          grep -q 'data class PhoneBillSnapshot' "$BILL_MODEL"
          grep -q 'CURRENT_PARSER_VERSION = 4' "$BILL_MODEL"
          grep -q 'data class IntegralSnapshot' "$INTEGRAL_MODEL"
          grep -q 'CURRENT_PARSER_VERSION = 1' "$INTEGRAL_MODEL"
          grep -q 'scoreType = "2"' "$INTEGRAL_MODEL"
          grep -q 'yearMonth ?: "all"' "$INTEGRAL_MODEL"

          grep -q 'mxx.client.10010.com' "$NETWORK"
          grep -q 'servicebusiness/newOrdered/provincialAlloc' "$NETWORK"
          grep -q 'serviceimportantbusiness/phoneBillNew/queryMonths' "$NETWORK"
          grep -q 'activity.10010.com' "$NETWORK"
          grep -q 'ZXGS97000017640,003' "$NETWORK"
          grep -q 'interface PhoneBillNetworkClient' "$NETWORK"
          grep -q 'interface IntegralNetworkClient' "$NETWORK"
          grep -q 'core.model.OrderedBusinessFetchResult' "$NETWORK"
          grep -q 'core.model.PhoneBillFetchResult' "$NETWORK"
          grep -q 'core.model.IntegralFetchResult' "$NETWORK"

          grep -q 'OrderedBusinessRefreshPolicy' "$SETTINGS"
          grep -q 'CACHE_PREFERRED' "$SETTINGS"
          grep -q 'cacheValidityHours: Int = 12' "$SETTINGS"
          grep -q 'noCacheAutoQuery: Boolean = false' "$SETTINGS"
          grep -q 'refreshAllAccountGapSeconds: Int = 1' "$SETTINGS"
          grep -q 'currentMonthCacheMinutes: Int = 10' "$SETTINGS"
          grep -q 'historicalCacheDays: Int = 15' "$SETTINGS"
          grep -q 'monthlyRecheckDay: Int = 2' "$SETTINGS"
          grep -q 'monthlyRecheckHour: Int = 8' "$SETTINGS"
          grep -q 'cycleMode: IntegralRefreshCycleMode = IntegralRefreshCycleMode.MONTHLY' "$SETTINGS"
          grep -q 'fixedIntervalHours: Int = 24' "$SETTINGS"
          grep -q 'checkOnEntry: Boolean = true' "$SETTINGS"

          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          echo "M8_A_FOUNDATION_GATE=PASS"

      - name: Run M8-A regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M8-A status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m8-foundation',
              description: passed ? 'M8-A business foundation gate passed' : 'M8-A business foundation regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M8-A verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
