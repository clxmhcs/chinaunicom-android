name: UI-30 Wire Refined Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-30-account-action-icon-refinement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ui30_wire_refined_icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsAccountScreen.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "UI-30: wire refined account action icons"
          git push origin HEAD:ui-30-account-action-icon-refinement
