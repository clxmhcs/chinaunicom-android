name: Android M3 Parsers

on:
  push:
    branches:
      - migration/android-m3-parsers
  pull_request:
    paths:
      - "app/**"
      - "core/model/**"
      - "core/parser/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-m3-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  parser-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Android API 37 platform package was not found."
            exit 1
          fi
          echo "ANDROID_API_37_PLATFORM_PACKAGE=$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Test M3 parsers and assemble app
        id: verify
        continue-on-error: true
        run: gradle :core:parser:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Publish M3 parser status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m3-parsers',
              description: passed ? 'M3 parser golden tests and assembleDebug passed' : 'M3 parser verification failed'
            });

      - name: Fail workflow when M3 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
