name: UI-30 Credential Action Icon Patch

on:
  push:
    branches:
      - ui-30-credential-action-icons
    paths:
      - '.github/workflows/ui-30-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-30-credential-action-icons
      - name: Refine credential action icons
        run: python3 .github/scripts/ui30_patch_icons.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/ui-30-patch.yml .github/scripts/ui30_patch_icons.py
      - name: Commit icon refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'UI-30: match credential action icons to iOS SF symbols'
          git push origin HEAD:ui-30-credential-action-icons
