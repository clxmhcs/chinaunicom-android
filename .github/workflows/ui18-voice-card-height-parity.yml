name: UI18 Voice Card Height Parity Patch

on:
  push:
    branches:
      - ui-18-voice-card-height-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-18-voice-card-height-parity
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/ui18_voice_card_height_parity.py
      - name: Verify
        run: |
          grep -F 'vertical = 17.14.dp' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -F 'Arrangement.spacedBy(15.43.dp)' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -F 'fontSize = if (showChevron) 13.5.sp else 10.29.sp' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -F 'VoiceProgressBar(fraction, compact = !showChevron)' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
      - name: Commit app source change
        run: |
          rm scripts/ui18_voice_card_height_parity.py .github/workflows/ui18-voice-card-height-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'UI-18: match iOS voice card intrinsic height'
          git push origin HEAD:ui-18-voice-card-height-parity
