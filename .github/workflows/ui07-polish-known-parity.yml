name: UI07 known parity corrections

on:
  push:
    branches:
      - ui-07-flow-account-detail-display-settings
    paths:
      - .github/workflows/ui07-polish-known-parity.yml

permissions:
  contents: write

jobs:
  patch-known-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-07-flow-account-detail-display-settings
          fetch-depth: 0
      - name: Apply guarded source-parity corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowAccountDetailScreen.kt')
          text = path.read_text()
          replacements = [
              (
                  '                        .width(302.dp)\n',
                  '                        .width(160.dp)\n',
              ),
              (
                  '    return if (digits.length >= 7) "${digits.take(3)}****${digits.takeLast(4)}" else value\n',
                  '    return if (digits.length >= 7) "${digits.take(3)} **** ${digits.takeLast(4)}" else value\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed for {old!r}: expected 1, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/ui07-polish-known-parity.yml
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowAccountDetailScreen.kt .github/workflows/ui07-polish-known-parity.yml
          git diff --cached --check
          git commit -m 'UI-07: align mobile mask and package bar geometry'
          git push origin HEAD:ui-07-flow-account-detail-display-settings
