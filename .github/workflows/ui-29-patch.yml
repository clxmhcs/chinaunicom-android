name: UI-29 Login Route Patch

on:
  push:
    branches:
      - ui-29-sms-login-ios-refinement
    paths:
      - '.github/workflows/ui-29-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-29-sms-login-ios-refinement
      - name: Patch login route
        run: python3 .github/scripts/ui29_patch.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/ui-29-patch.yml .github/scripts/ui29_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'UI-29: route credential login to iOS refined screen'
          git push origin HEAD:ui-29-sms-login-ios-refinement
