name: UI17 Settings Root Switch

on:
  push:
    branches:
      - ui-17-settings-ios-refinement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-17-settings-ios-refinement
      - name: Switch settings root composable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt')
          s = p.read_text()
          old = '''                composable(RootTab.Settings.route) {
                    SettingsRootScreen(
                        settingsViewModel = settingsViewModel,
                        onOpenCredentials = { navController.navigate(SETTINGS_CREDENTIALS_ROUTE) },
                        onOpenRefreshLogic = { navController.navigate(SETTINGS_REFRESH_ROUTE) },
                    )
                }'''
          new = '''                composable(RootTab.Settings.route) {
                    SettingsRootIosScreen(
                        settingsViewModel = settingsViewModel,
                        onOpenCredentials = { navController.navigate(SETTINGS_CREDENTIALS_ROUTE) },
                        onOpenRefreshLogic = { navController.navigate(SETTINGS_REFRESH_ROUTE) },
                    )
                }'''
          if old not in s:
              raise SystemExit('settings root anchor not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/ui17-settings-switch.yml').unlink()
          PY
      - name: Commit patch and cleanup workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt .github/workflows/ui17-settings-switch.yml
          git commit -m 'UI-17: route settings tab to iOS-refined root'
          git push origin HEAD:ui-17-settings-ios-refinement
