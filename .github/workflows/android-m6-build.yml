name: Android M6 Persistence Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M6_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m6-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M6_BASELINE.md"
      - ".github/workflows/android-m6-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  persistence-refresh-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M6-E quota repository boundary and prior M6 gates
        shell: bash
        run: |
          test -f data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRepository.kt
          grep -q 'interface QuotaRepository' data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRepository.kt
          grep -q 'class DefaultQuotaRepository' data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRepository.kt
          grep -q 'private val coordinator: QuotaRefreshCoordinator' data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRepository.kt
          grep -q 'private val quotaRepository: QuotaRepository' app/src/main/java/com/clxmhcs/chinaunicom/data/ProductionUnicomRepository.kt
          grep -q 'DefaultQuotaRepository(refreshCoordinator)' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          if grep -q 'QuotaRefreshCoordinator' app/src/main/java/com/clxmhcs/chinaunicom/data/ProductionUnicomRepository.kt; then
            echo "ERROR: app-facing ProductionUnicomRepository still depends on concrete QuotaRefreshCoordinator."
            exit 1
          fi

          test -f data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          test -f data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          test -f data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/BalanceRepository.kt
          test -f core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/BalanceAccountCredentialLifecycle.kt

          grep -q 'DEFAULT_REFRESH_INTERVAL_MINUTES = 60' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'DEFAULT_LEASE_DURATION.*Duration.ofMinutes(2)' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'MINIMUM_LEASE_SECONDS = 15L' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'MAXIMUM_LEASE_SECONDS = 10 \* 60L' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'beginAutomaticRefresh' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'beginForcedRefresh' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'failRefresh' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt
          grep -q 'toLocalDate()' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/SharedBalanceCacheStore.kt

          grep -q 'AtomicFile' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          grep -q 'channel.lock()' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          grep -q 'chinaunicom.balance.shared-cache.v1.json' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          grep -q 'chinaunicom.balanceLastAttemptAt.v1' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          grep -q 'chinaunicom.balanceAccountGroups.v1' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt
          grep -q 'chinaunicom.homeBalanceAccountID.v1' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/AndroidBalanceStorage.kt

          grep -q 'failureRetryMinutes: Int = 15' data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt
          grep -q 'intervalMinutes: Int = 60' data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt
          grep -q 'decodedInterval == 15' data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt
          grep -q 'BalanceRefreshIntervalSynchronizer' data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          grep -q 'updateAccountsFromBalance' data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRefreshCoordinator.kt
          grep -q 'accountPersistenceLock' data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRefreshCoordinator.kt
          grep -q 'lifecycle.refreshValidatedBalance' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/BalanceRepository.kt
          grep -q 'SharedBalanceRefreshSource.APP_AUTOMATIC' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/BalanceRepository.kt
          grep -q 'SharedBalanceRefreshSource.APP_MANUAL' data/balance/src/main/kotlin/com/clxmhcs/chinaunicom/data/balance/BalanceRepository.kt
          grep -q 'BalanceAccountCredentialLifecycleProvider.create' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          grep -q 'AndroidSharedBalanceCacheStores.create' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          grep -q 'DefaultBalanceRepository' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt

          if grep -RInE 'val[[:space:]]+(cookie|appID|tokenOnline)[[:space:]]*:' core/storage/src/main data/account/src/main data/refresh/src/main data/settings/src/main data/balance/src/main; then
            echo "ERROR: ordinary M6 layer declares credential fields."
            exit 1
          fi
          if grep -RIn 'AccountCredentials' core/storage/src/main data/account/src/main data/refresh/src/main data/settings/src/main data/balance/src/main; then
            echo "ERROR: ordinary M6 layer depends directly on AccountCredentials."
            exit 1
          fi
          if grep -RInE 'FakeUnicomRepository|mock-flow-|18600009025|896\.87|测试号码' app/src/main app/src/release; then
            echo "ERROR: fake fixture leaked into main/release."
            exit 1
          fi

          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 30' data/refresh/build.gradle.kts
          grep -q 'minSdk = 30' data/balance/build.gradle.kts
          echo "M6_E_QUOTA_REPOSITORY_GATE=PASS"

      - name: Run M6 final regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M6 final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m6-persistence',
              description: passed ? 'M6 quota repository + persistence/refresh gates passed' : 'M6 final regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M6 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
