name: Android M6 Persistence Repository

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "core/model/**"
      - "core/parser/**"
      - "core/network/**"
      - "core/security/**"
      - "core/login/**"
      - "core/storage/**"
      - "data/account/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M6_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m6-build.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/storage/**"
      - "data/account/**"
      - "settings.gradle.kts"
      - "docs/migration/M6_BASELINE.md"
      - ".github/workflows/android-m6-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  persistence-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Android API 37 platform package was not found."
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M6-A persistence and production repository boundary
        shell: bash
        run: |
          test -f core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataStore.kt
          test -f core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataCodec.kt
          test -f data/account/src/main/kotlin/com/clxmhcs/chinaunicom/data/account/AccountRepository.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/data/ProductionUnicomRepository.kt

          grep -q 'AtomicFile' core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataStore.kt
          grep -q 'persistence/accounts.json' core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataStore.kt
          grep -q 'accounts.sortedBy { it.sortOrder }' core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataStore.kt
          grep -q 'Instant::parse' core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataCodec.kt
          grep -q 'UUID.fromString' core/storage/src/main/kotlin/com/clxmhcs/chinaunicom/core/storage/AccountMetadataCodec.kt

          grep -q 'ValidatedLoginAccountSeed' data/account/src/main/kotlin/com/clxmhcs/chinaunicom/data/account/AccountRepository.kt
          grep -q 'DisplayPlacement.PRIMARY' data/account/src/main/kotlin/com/clxmhcs/chinaunicom/data/account/AccountRepository.kt
          grep -q 'baseAccount.automaticSummaryGroups' data/account/src/main/kotlin/com/clxmhcs/chinaunicom/data/account/AccountRepository.kt

          grep -q 'ProductionUnicomRepository' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          grep -q 'AndroidAccountMetadataStores.accounts(context)' app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          if grep -RIn 'PendingProductionUnicomRepository' app/src/main app/src/release; then
            echo "ERROR: release production repository placeholder still exists."
            exit 1
          fi
          if grep -RInE 'FakeUnicomRepository|mock-flow-|18600009025|896\.87|测试号码' app/src/main app/src/release; then
            echo "ERROR: fake repository fixture leaked into main/release sources."
            exit 1
          fi

          if grep -RInE 'val[[:space:]]+(cookie|appID|tokenOnline)[[:space:]]*:' core/storage/src/main data/account/src/main; then
            echo "ERROR: ordinary M6 metadata persistence declares credential fields."
            exit 1
          fi
          if grep -RIn 'AccountCredentials' core/storage/src/main data/account/src/main; then
            echo "ERROR: ordinary M6 metadata layer depends on AccountCredentials."
            exit 1
          fi

          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 30' core/storage/build.gradle.kts
          grep -q 'minSdk = 30' data/account/build.gradle.kts
          grep -q 'AndroidViewModel' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt
          echo "M6_A_PERSISTENCE_PRODUCTION_REPOSITORY_BOUNDARY=PASS"

      - name: Run M6-A regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M6-A status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m6-persistence',
              description: passed ? 'M6-A persistence/repository tests + debug/release assemble passed' : 'M6-A persistence/repository regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow when M6-A verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
