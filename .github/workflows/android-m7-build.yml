name: Android M7 Flow Voice Functional

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M7_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m7-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "settings.gradle.kts"
      - "docs/migration/M7_BASELINE.md"
      - ".github/workflows/android-m7-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  flow-voice-functional-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M7-A flow voice functional boundary
        shell: bash
        run: |
          test -f app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowUiState.kt

          grep -q 'UnicomAppState' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowUiState.kt
          grep -q 'BalanceRepositoryState' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowUiState.kt
          grep -q 'combine(repository.appState, repository.balanceState)' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt
          grep -q 'val flowViewModel: FlowViewModel = viewModel()' app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          grep -q 'FlowHomeScreen(flowViewModel)' app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          grep -q 'VoiceDashboardScreen(flowViewModel)' app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          ! grep -q 'VoiceDashboardPlaceholder()' app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt

          grep -q 'refreshHomeBalanceManually' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -q 'refreshAccount' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -q 'remainingQuerySnapshot' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -q 'packages.take(2)' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -q '查看更多' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt
          grep -q 'visibleSummaryGroups' app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt

          grep -q 'visibleVoicePackages' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          grep -q '语音相关数据不单独执行刷新' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt
          if grep -E 'flowViewModel\.(refresh|refreshAccount|refreshHomeBalanceManually)' app/src/main/java/com/clxmhcs/chinaunicom/ui/VoiceDashboardScreen.kt; then
            echo "ERROR: voice dashboard introduced an independent refresh action."
            exit 1
          fi

          grep -q 'minSdk = 30' app/build.gradle.kts
          grep -q 'versionName = "0.7.0-m7a"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

          if grep -RInE 'FakeUnicomRepository|mock-flow-|18600009025|896\.87|测试号码' app/src/main app/src/release; then
            echo "ERROR: fake fixture leaked into main/release."
            exit 1
          fi
          echo "M7_A_FUNCTIONAL_GATE=PASS"

      - name: Run M7-A regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M7-A status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m7-functional',
              description: passed ? 'M7-A flow/voice functional gate passed' : 'M7-A flow/voice regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M7-A verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
