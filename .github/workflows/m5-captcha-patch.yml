name: Apply M5 Captcha Patch

on:
  push:
    branches:
      - m5-sms-captcha-webview-parity
    paths:
      - .github/scripts/apply_m5_sms_captcha_patch.py
      - .github/workflows/m5-captcha-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-sms-captcha-webview-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python .github/scripts/apply_m5_sms_captcha_patch.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt \
                  app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsAccountScreen.kt \
                  app/src/main/java/com/clxmhcs/chinaunicom/ui/UnicomCaptchaVerificationDialog.kt
          git diff --cached --quiet && exit 0
          git commit -m "M5: add SMS captcha WebView parity"
          git push origin HEAD:m5-sms-captcha-webview-parity
