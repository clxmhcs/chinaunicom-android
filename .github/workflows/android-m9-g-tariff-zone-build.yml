name: Android M9 G Tariff Zone

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/tariffzone/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-g-tariff-zone-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/tariffzone/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-g-tariff-zone-build.yml"

permissions:
  contents: read

jobs:
  m9-g-tariff-zone:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-G source-derived boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/TariffZoneModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomTariffZoneClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/TariffZoneAccountCredentialLifecycle.kt
          STORE=data/tariffzone/src/main/kotlin/com/clxmhcs/chinaunicom/data/tariffzone/TariffZoneStore.kt
          REGION=data/tariffzone/src/main/kotlin/com/clxmhcs/chinaunicom/data/tariffzone/TariffZoneRegionCatalog.kt
          SCREEN=app/src/main/java/com/clxmhcs/chinaunicom/ui/TariffZoneScreen.kt
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/TariffZoneViewModel.kt
          OTHER=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          BUILD=app/build.gradle.kts
          MODULE=data/tariffzone/build.gradle.kts
          for file in "$MODEL" "$CLIENT" "$LIFECYCLE" "$STORE" "$REGION" "$SCREEN" "$VM" "$OTHER" "$APP" "$BUILD" "$MODULE"; do test -f "$file"; done

          grep -q 'include(":data:tariffzone")' settings.gradle.kts
          grep -q 'implementation(project(":data:tariffzone"))' "$BUILD"
          grep -q 'minSdk = 30' "$BUILD"
          grep -q 'minSdk = 30' "$MODULE"
          grep -Eq 'versionName = "0\.9\.0-m9[a-z0-9.-]*"' "$BUILD"
          grep -q 'NATIONAL("1")' "$MODEL"
          grep -q 'LOCAL("2")' "$MODEL"
          grep -q 'TariffZoneFirstLevel("1", "套餐"' "$MODEL"
          grep -q 'TariffZoneSecondLevel("1001", "移网")' "$MODEL"
          grep -q 'TariffZoneFirstLevel("99", "停售套餐"' "$MODEL"
          grep -q 'https://mxx.client.10010.com' "$CLIENT"
          grep -q '/servicequerybusiness/queryTariffNew/indexData' "$CLIENT"
          grep -q '/servicequerybusiness/queryTariffNew/threeLevelName' "$CLIENT"
          grep -q '/servicequerybusiness/queryTariffNew/operateData' "$CLIENT"
          grep -q '"tariffAttributes" to scope.rawValue' "$CLIENT"
          grep -q '"behaviorId" to behaviorID' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q 'https://imgxx.client.10010.com' "$CLIENT"
          grep -q 'zifeizhuanqu/index.html' "$CLIENT"
          grep -q 'root.text("code") == "0001"' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'CredentialStore' "$LIFECYCLE"
          grep -q 'updatedCredentials?.let { credentialStore.save' "$LIFECYCLE"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"
          grep -q 'BATCH_SIZE = 5' "$STORE"
          grep -q 'searchIndexKey' "$STORE"
          grep -q 'TariffZoneRegionCatalog.regions' "$STORE"
          grep -q 'TariffZoneScope.LOCAL' "$STORE"
          ! grep -R -E 'AtomicFile|SettingsRepository' data/tariffzone/src/main
          grep -q 'OtherBusinessEntry("资费专区", enabled = true)' "$OTHER"
          grep -q 'onOpenTariffZone' "$OTHER"
          grep -q 'OTHER_TARIFF_ZONE_ROUTE = "other/tariff-zone"' "$APP"
          grep -q 'TariffZoneScreen(' "$APP"
          grep -q 'val mobileAccounts = (flowState as? FlowUiState.Content)?.accounts.orEmpty()' "$APP"
          grep -q '名称/关键词/方案编号' "$SCREEN"
          grep -q '本地资费' "$SCREEN"
          grep -q '全国资费' "$SCREEN"
          grep -q '加载更多' "$SCREEN"
          ! grep -Eqi 'BroadbandAccount|cookie|token_online|appid|idcardlastsix' "$SCREEN"
          echo "M9_G_TARIFF_ZONE_GATE=PASS"

      - name: Run M9-G regression
        run: ./gradlew :core:model:testDebugUnitTest :core:network:testDebugUnitTest :core:login:testDebugUnitTest :data:tariffzone:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
