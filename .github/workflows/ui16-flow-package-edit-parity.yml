name: UI16 Flow Package Edit Parity Patch

on:
  push:
    branches:
      - ui-16-flow-package-edit-parity
    paths:
      - scripts/ui16_flow_package_edit_parity.py
      - .github/workflows/ui16-flow-package-edit-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui-16-flow-package-edit-parity

      - name: Apply patch
        run: python3 scripts/ui16_flow_package_edit_parity.py

      - name: Verify
        run: |
          SCREEN=app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowAccountDetailScreen.kt
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowDisplaySettingsViewModel.kt
          grep -F 'private fun FlowPackageEditDialog(' "$SCREEN"
          grep -F 'selectedFlowPackageID = packageValue.id' "$SCREEN"
          grep -F 'fun updatePackagePreference(' "$VM"
          grep -F 'fun restorePackagePreference(' "$VM"

      - name: Commit app source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowAccountDetailScreen.kt \
                  app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowDisplaySettingsViewModel.kt
          git commit -m 'UI-16: add iOS-parity flow package editor'
          git push origin HEAD:ui-16-flow-package-edit-parity
