name: Android FINAL

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - work/android-final

permissions:
  contents: read
  statuses: write

jobs:
  android-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Android API 37 platform package was not found."
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify FINAL architecture and security authority
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="app/build.gradle.kts"
          SETTINGS="settings.gradle.kts"
          MANIFEST="app/src/main/AndroidManifest.xml"
          CREDENTIAL_STORE="core/security/src/main/kotlin/com/clxmhcs/chinaunicom/core/security/AndroidCredentialStore.kt"
          CAPTURE_SERVICE="capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureVpnService.kt"
          CAPTURE_PROXY="capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureLocalProxyServer.kt"
          TLS_ARCH="capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureTlsArchitecture.kt"
          MITM_COORD="capture/src/main/java/com/clxmhcs/chinaunicom/capture/CaptureMitmProxyCoordinator.kt"
          FINAL_DOC="docs/migration/ANDROID_FINAL_ACCEPTANCE.md"

          for file in "$APP_GRADLE" "$SETTINGS" "$MANIFEST" "$CREDENTIAL_STORE" "$CAPTURE_SERVICE" "$CAPTURE_PROXY" "$TLS_ARCH" "$MITM_COORD" "$FINAL_DOC"; do
            test -f "$file"
          done

          grep -q 'minSdk = 30' "$APP_GRADLE"
          grep -q 'compileSdk = 37' "$APP_GRADLE"
          grep -q 'targetSdk = 36' "$APP_GRADLE"
          grep -q 'versionName = ".*-final1"' "$APP_GRADLE"
          grep -q 'include(":widget")' "$SETTINGS"
          grep -q 'include(":capture")' "$SETTINGS"
          grep -q 'implementation(project(":widget"))' "$APP_GRADLE"
          grep -q 'implementation(project(":capture"))' "$APP_GRADLE"

          grep -q 'AndroidKeyStore' "$CREDENTIAL_STORE"
          grep -q 'AES/GCM/NoPadding' "$CREDENTIAL_STORE"
          grep -q 'android:allowBackup="false"' "$MANIFEST"

          if grep -RInE 'putString\([^\n]*(cookie|tokenOnline|token_online|password|smsCode|verificationCode|resultToken)' \
            app/src/main core/security/src/main core/login/src/main data/account/src/main; then
            echo "ERROR: secret login/account field appears to be written directly to SharedPreferences."
            exit 1
          fi

          if grep -RInE '(Log\.[vdiewtf]|println|print)\s*\([^\n]*(password|token_online|tokenOnline|authorization|cookie|smsCode|verificationCode|resultToken)' \
            app/src/main core/*/src/main data/*/src/main capture/src/main widget/src/main --include='*.kt'; then
            echo "ERROR: sensitive credential material appears in runtime logging."
            exit 1
          fi

          if grep -RInE 'ShortcutManager|ShortcutManagerCompat|ShortcutInfoCompat|android\.content\.pm\.ShortcutInfo' \
            app/src/main core/*/src/main data/*/src/main capture/src/main widget/src/main --include='*.kt'; then
            echo "ERROR: Android shortcut implementation exists even though shortcuts were explicitly skipped."
            exit 1
          fi

          mapfile -t JS_BRIDGES < <(grep -RIl 'addJavascriptInterface' app/src/main --include='*.kt' | sort)
          EXPECTED_JS_BRIDGES=(
            'app/src/main/java/com/clxmhcs/chinaunicom/ui/ElectronicReceiptScreen.kt'
            'app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt'
          )
          if [ "${JS_BRIDGES[*]}" != "${EXPECTED_JS_BRIDGES[*]}" ]; then
            printf 'ERROR: unexpected JavaScript bridge surface: %s\n' "${JS_BRIDGES[*]}"
            exit 1
          fi
          grep -q 'MIXED_CONTENT_NEVER_ALLOW' app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt
          grep -q 'allowFileAccess = false' app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt
          grep -q 'removeJavascriptInterface' app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt
          grep -q 'value == "10010.com" || value.endsWith(".10010.com")' app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt
          grep -q 'RECEIPT_DOCUMENT_START_ORIGINS' app/src/main/java/com/clxmhcs/chinaunicom/ui/ElectronicReceiptScreen.kt
          grep -q 'isAllowedReceiptUrl' app/src/main/java/com/clxmhcs/chinaunicom/ui/ElectronicReceiptScreen.kt
          grep -q 'allowFileAccess = false' app/src/main/java/com/clxmhcs/chinaunicom/ui/ElectronicReceiptScreen.kt
          grep -q 'removeJavascriptInterface' app/src/main/java/com/clxmhcs/chinaunicom/ui/ElectronicReceiptScreen.kt

          if grep -RInE 'FakeUnicomRepository|mock-flow-|18600009025|896\.87|测试号码' app/src/main app/src/release; then
            echo "ERROR: fake repository fixture leaked into main/release sources."
            exit 1
          fi
          test -f app/src/debug/java/com/clxmhcs/chinaunicom/data/FakeUnicomRepository.kt

          grep -q 'CaptureLocalProxyServer' "$CAPTURE_SERVICE"
          grep -q 'ProxyInfo.buildDirectProxy' "$CAPTURE_SERVICE"
          grep -q 'setHttpProxy' "$CAPTURE_SERVICE"
          grep -q 'SAFE_ROUTE_ADDRESS = "192.0.2.0"' "$CAPTURE_SERVICE"
          grep -q 'SAFE_ROUTE_PREFIX_LENGTH = 24' "$CAPTURE_SERVICE"
          grep -q 'vpnService.protect(socket)' "$CAPTURE_PROXY"
          grep -q 'BIND_HOST = "127.0.0.1"' "$CAPTURE_PROXY"
          grep -q 'DEFAULT_PORT = 9090' "$CAPTURE_PROXY"
          grep -q 'CONNECT_ESTABLISHED_BYTES' "$CAPTURE_PROXY"
          grep -q 'HOST_CERTIFICATE_GENERATION_AVAILABLE: Boolean = false' "$TLS_ARCH"
          grep -q 'ACTIVE_TLS_DECRYPTION_AVAILABLE: Boolean = false' "$TLS_ARCH"
          grep -q '!hostCertificateGenerationAvailable' "$MITM_COORD"
          grep -q '!activeTlsDecryptionAvailable' "$MITM_COORD"
          if grep -Eq '0\.0\.0\.0|::/0|addRoute\([^,]+,[[:space:]]*0\)' "$CAPTURE_SERVICE"; then
            echo "ERROR: CaptureTool default route contract changed."
            exit 1
          fi

          grep -q 'Android 11 / API 30' "$FINAL_DOC"
          grep -q '快捷指令' "$FINAL_DOC"
          grep -q 'advanced TLS device acceptance' "$FINAL_DOC"
          grep -q 'M14' "$FINAL_DOC"
          echo "ANDROID_FINAL_AUTHORITY=PASS"

      - name: Run FINAL all-module unit tests and release builds
        id: verify
        continue-on-error: true
        run: >-
          gradle
          testDebugUnitTest
          :widget:assembleDebug
          :capture:assembleDebug
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish FINAL status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-final',
              description: passed ? 'FINAL authority, unit tests, debug/release builds passed' : 'FINAL Android regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow when FINAL verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
