name: Android M9 E Phone Bill

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/phonebill/**"
      - "data/comprehensive/**"
      - ".github/workflows/android-m9-e-phone-bill-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/phonebill/**"
      - "data/comprehensive/**"
      - ".github/workflows/android-m9-e-phone-bill-build.yml"

permissions:
  contents: read

jobs:
  m9-e-phone-bill:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-E1 Phone Bill reuse boundary
        shell: bash
        run: |
          OTHER=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          SELECTOR=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherPhoneBillAccountSelectionScreen.kt
          ENTRY=app/src/main/java/com/clxmhcs/chinaunicom/ui/ComprehensiveBusinessScreen.kt
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/ComprehensiveBusinessViewModel.kt
          FLOW_VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          BUILD=app/build.gradle.kts
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPhoneBillClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/PhoneBillAccountCredentialLifecycle.kt
          STORE=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/PhoneBillStore.kt
          CACHE=data/phonebill/src/main/kotlin/com/clxmhcs/chinaunicom/data/phonebill/AndroidPhoneBillDiskCache.kt
          for file in "$OTHER" "$SELECTOR" "$ENTRY" "$VM" "$FLOW_VM" "$APP" "$BUILD" "$CLIENT" "$LIFECYCLE" "$STORE" "$CACHE"; do test -f "$file"; done

          grep -q 'minSdk = 30' "$BUILD"
          grep -Eq 'versionName = "0\.9\.0-[a-z0-9.-]+"' "$BUILD"
          grep -q 'OtherBusinessEntry("话费 / 账单", enabled = true)' "$OTHER"
          grep -q 'onOpenPhoneBill' "$OTHER"
          grep -q 'OTHER_PHONE_BILL_ROUTE = "other/phone-bill"' "$APP"
          grep -q 'OTHER_PHONE_BILL_DETAIL_ROUTE = "other/phone-bill/{accountId}"' "$APP"
          grep -q 'OtherPhoneBillAccountSelectionScreen(' "$APP"
          grep -q 'representativeAccountID = flowViewModel::financialRepresentativeAccountID' "$APP"
          grep -q 'PhoneBillEntryScreen(' "$APP"

          grep -q 'seenRepresentativeIDs' "$SELECTOR"
          grep -q 'representativeAccountID(source.id) ?: source.id' "$SELECTOR"
          grep -q 'account.isEnabled && account.mobile.count { it.isDigit() } == 11' "$SELECTOR"
          grep -q '有效合账组只显示统一账务代表号码一次' "$SELECTOR"
          ! grep -Eqi 'broadband|cookie|token_online|appid|idcardlastsix' "$SELECTOR"

          grep -q 'fun financialRepresentativeAccountID' "$FLOW_VM"
          grep -q 'PhoneBillEntryScreen' "$ENTRY"
          grep -q 'AndroidPhoneBillStores.create' "$VM"
          grep -q 'PhoneBillAccountCredentialLifecycle' "$LIFECYCLE"
          grep -q 'suspend fun loadIfNeeded' "$STORE"
          grep -q 'suspend fun reload' "$STORE"
          grep -q 'suspend fun select' "$STORE"
          grep -q 'suspend fun refreshSelectedMonth' "$STORE"
          grep -q '13个月' "$STORE"
          grep -q 'AtomicFile' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          echo "M9_E1_PHONE_BILL_REUSE_GATE=PASS"

      - name: Run M9-E1 regression
        run: ./gradlew :core:model:testDebugUnitTest :core:network:testDebugUnitTest :core:login:testDebugUnitTest :data:phonebill:testDebugUnitTest :data:comprehensive:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
