name: TEMP UI-06 visual refinement

on:
  push:
    branches: [ui-06-phone-bill-visual-refine]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-06-phone-bill-visual-refine
      - name: Apply source-derived phone bill visual refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bill_path = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/PhoneBillScreen.kt')
          s = bill_path.read_text()

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          def replace_fun(text, name, next_name, replacement):
              pattern = rf'@Composable\nprivate fun {re.escape(name)}\(.*?(?=\n@Composable\nprivate fun {re.escape(next_name)}\()'
              new_text, count = re.subn(pattern, replacement.rstrip(), text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'failed replacing {name}: {count}')
              return new_text

          s = must_replace(s, 'import androidx.compose.foundation.Canvas\n', 'import android.app.Activity\nimport android.content.Context\nimport android.content.ContextWrapper\nimport androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.border\n', 'bill imports android/border')
          s = must_replace(s, 'import androidx.compose.foundation.layout.Column\n', 'import androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.defaultMinSize\n', 'bill defaultMinSize import')
          s = must_replace(s, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.offset\nimport androidx.compose.foundation.layout.padding\n', 'bill offset import')
          s = must_replace(s, 'import androidx.compose.runtime.Composable\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\n', 'bill DisposableEffect import')
          s = must_replace(s, 'import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.toArgb\n', 'bill toArgb import')
          s = must_replace(s, 'import androidx.compose.ui.text.font.FontWeight\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalView\nimport androidx.compose.ui.text.font.FontWeight\n', 'bill platform imports')
          s = must_replace(s, 'import com.clxmhcs.chinaunicom.core.model.BillItemSection\n', 'import androidx.core.view.WindowCompat\nimport com.clxmhcs.chinaunicom.core.model.BillItemSection\n', 'bill WindowCompat import')

          s = must_replace(
              s,
              '    val displayMobile = if (settings.hideMobileMiddleDigits) compactMaskMobile(account.mobile) else account.mobile\n\n    LaunchedEffect(account.id)',
              '    val displayMobile = if (settings.hideMobileMiddleDigits) compactMaskMobile(account.mobile) else account.mobile\n\n    PhoneBillSystemBars()\n\n    LaunchedEffect(account.id)',
              'bill system bar call',
          )

          s = replace_fun(s, 'PhoneBillHeader', 'PhoneBillMonthSelector', r'''@Composable
          private fun PhoneBillHeader(
              mobile: String,
              months: List<BillMonth>,
              selectedMonth: BillMonth?,
              loading: Boolean,
              onBack: () -> Unit,
              onRefresh: () -> Unit,
              onSelectMonth: (BillMonth) -> Unit,
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(
                          Brush.linearGradient(
                              colors = listOf(BillRed, BillDeepRed),
                              start = Offset.Zero,
                              end = Offset(1000f, 700f),
                          ),
                      ),
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(62.dp)
                          .padding(horizontal = 10.dp, vertical = 4.dp),
                  ) {
                      Text(
                          "‹",
                          modifier = Modifier
                              .align(Alignment.CenterStart)
                              .size(44.dp)
                              .clickable(onClick = onBack),
                          fontSize = 40.sp,
                          lineHeight = 44.sp,
                          fontWeight = FontWeight.Normal,
                          color = Color.White,
                          textAlign = TextAlign.Center,
                      )

                      Column(
                          modifier = Modifier
                              .align(Alignment.Center)
                              .offset(y = (-6).dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(2.dp),
                      ) {
                          Text(
                              "我的账单",
                              fontSize = 17.sp,
                              lineHeight = 21.sp,
                              fontWeight = FontWeight.Medium,
                              color = Color.White,
                          )
                          Text(
                              mobile,
                              fontSize = 15.sp,
                              lineHeight = 18.sp,
                              fontWeight = FontWeight.Medium,
                              color = Color.White.copy(alpha = 0.86f),
                          )
                      }

                      Text(
                          "↻",
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .size(44.dp)
                              .clickable(enabled = !loading, onClick = onRefresh),
                          fontSize = 30.sp,
                          lineHeight = 44.sp,
                          fontWeight = FontWeight.Normal,
                          color = Color.White.copy(alpha = if (loading) 0.45f else 1f),
                          textAlign = TextAlign.Center,
                      )
                  }

                  PhoneBillMonthSelector(
                      months = months,
                      selectedMonth = selectedMonth,
                      onSelectMonth = onSelectMonth,
                  )
              }
          }''')

          s = replace_fun(s, 'PhoneBillMonthSelector', 'PhoneBillContent', r'''@Composable
          private fun PhoneBillMonthSelector(
              months: List<BillMonth>,
              selectedMonth: BillMonth?,
              onSelectMonth: (BillMonth) -> Unit,
          ) {
              val scrollState = rememberScrollState()
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(56.dp)
                      .offset(y = (-2).dp)
                      .horizontalScroll(scrollState)
                      .padding(horizontal = 24.dp),
                  horizontalArrangement = Arrangement.spacedBy(26.dp),
                  verticalAlignment = Alignment.Top,
              ) {
                  months.forEach { month ->
                      val selected = selectedMonth?.id == month.id
                      Column(
                          modifier = Modifier
                              .width(54.dp)
                              .clickable { onSelectMonth(month) },
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(6.dp),
                      ) {
                          Text(
                              month.title,
                              fontSize = 20.sp,
                              lineHeight = 24.sp,
                              fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,
                              color = Color.White.copy(alpha = if (selected) 1f else 0.68f),
                          )
                          Text(
                              month.subtitle,
                              fontSize = 12.sp,
                              lineHeight = 14.sp,
                              fontWeight = FontWeight.Medium,
                              color = Color.White.copy(alpha = if (selected) 0.90f else 0.56f),
                          )
                          Box(
                              modifier = Modifier
                                  .width(30.dp)
                                  .height(4.dp)
                                  .clip(RoundedCornerShape(2.dp))
                                  .background(if (selected) Color.White else Color.Transparent),
                          )
                      }
                  }
              }
          }''')

          s = replace_fun(s, 'PhoneBillContent', 'BillSummaryCard', r'''@Composable
          private fun PhoneBillContent(
              snapshot: PhoneBillSnapshot,
              refreshPolicy: PhoneBillRefreshPolicy,
              selectedScope: BillScope,
              hideMobileMiddleDigits: Boolean,
              onScopeChange: (BillScope) -> Unit,
              onOpenUnavailableBalance: () -> Unit,
          ) {
              Box(modifier = Modifier.fillMaxWidth()) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(160.dp)
                          .background(
                              Brush.verticalGradient(
                                  colors = listOf(
                                      BillDeepRed,
                                      BillRed.copy(alpha = 0.76f),
                                      Color.Transparent,
                                  ),
                              ),
                          ),
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(bottom = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp),
                  ) {
                      BillSummaryCard(
                          snapshot = snapshot,
                          policy = refreshPolicy,
                          modifier = Modifier.padding(horizontal = 7.dp),
                          onOpenUnavailableBalance = onOpenUnavailableBalance,
                      )

                      Surface(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 7.dp),
                          shape = RoundedCornerShape(10.dp),
                          color = Color.White,
                          shadowElevation = 0.dp,
                      ) {
                          Column {
                              BillScopePicker(selectedScope = selectedScope, onScopeChange = onScopeChange)
                              Divider(color = BillDivider)
                              if (selectedScope == BillScope.USER) {
                                  UserBillList(
                                      userBills = snapshot.userBills,
                                      hideMobileMiddleDigits = hideMobileMiddleDigits,
                                  )
                              } else {
                                  AccountBillDetail(
                                      sections = snapshot.accountSections,
                                      summary = snapshot.summary,
                                  )
                              }
                          }
                      }
                  }
              }
          }''')

          s = replace_fun(s, 'BillSummaryCard', 'BillScopePicker', r'''@Composable
          private fun BillSummaryCard(
              snapshot: PhoneBillSnapshot,
              policy: PhoneBillRefreshPolicy,
              modifier: Modifier = Modifier,
              onOpenUnavailableBalance: () -> Unit,
          ) {
              val nextQueryTime = remember(snapshot, policy) {
                  PhoneBillCachePolicy(PhoneBillPolicyProvider { policy })
                      .nextQueryTime(snapshot, Instant.now())
              }
              val queryTime = snapshot.queryTime?.takeIf { it.isNotBlank() } ?: billTimestamp(snapshot.fetchedAt)

              Box(
                  modifier = modifier
                      .fillMaxWidth()
                      .shadow(16.dp, RoundedCornerShape(14.dp), ambientColor = Color.Black.copy(alpha = 0.08f))
                      .clip(RoundedCornerShape(14.dp))
                      .background(Color.White),
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(118.dp)
                          .background(
                              Brush.verticalGradient(
                                  colors = listOf(
                                      BillRed.copy(alpha = 0.16f),
                                      Color(0xFFFFEFE8).copy(alpha = 0.82f),
                                      Color.Transparent,
                                  ),
                              ),
                          ),
                  )

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 8.dp)
                          .padding(top = 16.dp, bottom = 24.dp),
                      verticalArrangement = Arrangement.spacedBy(18.dp),
                  ) {
                      Column(
                          modifier = Modifier.offset(y = (-6).dp),
                          verticalArrangement = Arrangement.spacedBy(1.dp),
                      ) {
                          Text(
                              "上次查询时间：$queryTime",
                              fontSize = 12.5.sp,
                              lineHeight = 15.sp,
                              color = BillSecondary,
                          )
                          Text(
                              "下次查询时间：${nextQueryTime?.let(::billTimestamp) ?: "未知"}",
                              fontSize = 12.5.sp,
                              lineHeight = 15.sp,
                              color = BillSecondary,
                          )
                      }

                      Column(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(10.dp),
                      ) {
                          Text(
                              "本月已消费（元）",
                              fontSize = 22.sp,
                              lineHeight = 28.sp,
                              fontWeight = FontWeight.Medium,
                              color = Color.Black,
                          )
                          Row(
                              verticalAlignment = Alignment.Bottom,
                              horizontalArrangement = Arrangement.spacedBy(10.dp),
                          ) {
                              Text(
                                  "¥",
                                  fontSize = 20.5.sp,
                                  lineHeight = 30.sp,
                                  fontWeight = FontWeight.Medium,
                                  color = Color.Black,
                              )
                              Text(
                                  snapshot.summary.realPayFee,
                                  fontSize = 31.sp,
                                  lineHeight = 36.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = Color.Black,
                              )
                          }
                      }
                  }

                  Row(
                      modifier = Modifier
                          .align(Alignment.TopEnd)
                          .padding(top = 10.dp, end = 10.dp)
                          .clip(CircleShape)
                          .clickable(onClick = onOpenUnavailableBalance)
                          .padding(horizontal = 8.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(3.dp),
                  ) {
                      Text(
                          "不可用金额",
                          fontSize = 12.sp,
                          lineHeight = 16.sp,
                          color = BillSecondary,
                      )
                      Box(
                          modifier = Modifier
                              .size(14.dp)
                              .clip(CircleShape)
                              .background(BillSecondary.copy(alpha = 0.14f)),
                          contentAlignment = Alignment.Center,
                      ) {
                          Text(
                              "?",
                              fontSize = 9.sp,
                              lineHeight = 10.sp,
                              fontWeight = FontWeight.SemiBold,
                              color = BillSecondary,
                              textAlign = TextAlign.Center,
                          )
                      }
                  }
              }
          }''')

          s = replace_fun(s, 'BillScopePicker', 'UserBillList', r'''@Composable
          private fun BillScopePicker(
              selectedScope: BillScope,
              onScopeChange: (BillScope) -> Unit,
          ) {
              Row(modifier = Modifier.fillMaxWidth()) {
                  BillScope.entries.forEach { scope ->
                      val selected = selectedScope == scope
                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .clickable { onScopeChange(scope) }
                              .padding(top = 14.dp, bottom = 8.dp),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                      ) {
                          Text(
                              scope.title,
                              fontSize = 16.5.sp,
                              lineHeight = 21.sp,
                              fontWeight = if (selected) FontWeight.Medium else FontWeight.Normal,
                              color = if (selected) Color.Black else BillSecondary,
                          )
                          Box(
                              modifier = Modifier
                                  .width(34.dp)
                                  .height(4.dp)
                                  .clip(RoundedCornerShape(2.dp))
                                  .background(if (selected) BillRed else Color.Transparent),
                          )
                      }
                  }
              }
          }''')

          s = replace_fun(s, 'UserBillRow', 'UserOutlineIcon', r'''@Composable
          private fun UserBillRow(
              userBill: UserBill,
              expanded: Boolean,
              hideMobileMiddleDigits: Boolean,
              onClick: () -> Unit,
          ) {
              val arrowRotation by animateFloatAsState(
                  targetValue = if (expanded) 180f else 0f,
                  animationSpec = tween(180),
                  label = "billChevron",
              )
              val displayMobile = if (hideMobileMiddleDigits) compactMaskMobile(userBill.mobile) else userBill.mobile.replace(" ", "")
              val badge = billAccountBadge(userBill)

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable(onClick = onClick)
                      .padding(horizontal = 9.dp, vertical = 16.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  UserOutlineIcon()

                  Row(
                      modifier = Modifier.weight(1f),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(5.dp),
                  ) {
                      Text(
                          displayMobile,
                          fontSize = 16.5.sp,
                          lineHeight = 21.sp,
                          fontWeight = FontWeight.Medium,
                          color = Color.Black,
                          maxLines = 1,
                      )
                      badge?.let { BillAccountBadgeView(it) }
                  }

                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(4.dp),
                  ) {
                      Text(
                          "当月应付：",
                          fontSize = 13.5.sp,
                          lineHeight = 17.sp,
                          color = BillSecondary,
                          maxLines = 1,
                      )
                      Text(
                          userBill.payable,
                          fontSize = 16.5.sp,
                          lineHeight = 21.sp,
                          fontWeight = FontWeight.Medium,
                          color = BillRed,
                          maxLines = 1,
                      )
                      Text(
                          "⌄",
                          modifier = Modifier.rotate(arrowRotation),
                          fontSize = 18.sp,
                          lineHeight = 18.sp,
                          color = Color(0xFFC7C7CC),
                      )
                  }
              }
          }''')

          s = replace_fun(s, 'BillAccountBadgeView', 'AccountBillDetail', r'''@Composable
          private fun BillAccountBadgeView(badge: BillAccountBadge) {
              val shape = RoundedCornerShape(1.8.dp)
              Text(
                  badge.title,
                  modifier = Modifier
                      .defaultMinSize(minWidth = 12.1.dp, minHeight = 12.1.dp)
                      .clip(shape)
                      .background(badge.foreground.copy(alpha = 0.08f))
                      .border(1.dp, badge.foreground.copy(alpha = 0.34f), shape)
                      .padding(horizontal = 0.7.dp),
                  fontSize = 9.4.sp,
                  lineHeight = 12.sp,
                  fontWeight = FontWeight.SemiBold,
                  color = badge.foreground,
                  textAlign = TextAlign.Center,
              )
          }''')

          anchor = 'private fun compactMaskMobile(value: String): String {'
          system_bars = r'''@Suppress("DEPRECATION")
          @Composable
          private fun PhoneBillSystemBars() {
              val context = LocalContext.current
              val view = LocalView.current
              DisposableEffect(context, view) {
                  val window = context.findHostActivity()?.window
                  if (window == null) {
                      onDispose { }
                  } else {
                      val previousStatusBarColor = window.statusBarColor
                      val controller = WindowCompat.getInsetsController(window, view)
                      val previousLightStatusBars = controller.isAppearanceLightStatusBars

                      window.statusBarColor = BillRed.toArgb()
                      controller.isAppearanceLightStatusBars = false

                      onDispose {
                          window.statusBarColor = previousStatusBarColor
                          controller.isAppearanceLightStatusBars = previousLightStatusBars
                      }
                  }
              }
          }

          private fun Context.findHostActivity(): Activity? {
              var current: Context? = this
              while (current is ContextWrapper) {
                  if (current is Activity) return current
                  current = current.baseContext
              }
              return current as? Activity
          }

          '''
          if anchor not in s:
              raise SystemExit('missing system bars insertion anchor')
          s = s.replace(anchor, system_bars + anchor, 1)
          bill_path.write_text(s)

          root_path = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt')
          r = root_path.read_text()
          r = must_replace(r, 'import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.height\nimport androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.padding\n', 'root layout imports')
          r = must_replace(r, 'import androidx.compose.material3.MaterialTheme\n', 'import androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Surface\n', 'root Surface import')
          r = must_replace(r, 'import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\n', 'root Alignment import')
          r = must_replace(r, 'import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\n', 'root FontWeight import')
          r = must_replace(r, 'import androidx.compose.ui.unit.dp\n', 'import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.ui.unit.dp\n', 'root shape import')

          old_bottom = '''            bottomBar = {
                          NavigationBar(
                              containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.96f),
                              tonalElevation = 0.dp,
                          ) {
                              RootTab.entries.forEach { tab ->
                                  val selected = when (tab) {
                                      RootTab.Comprehensive -> currentRoute?.startsWith(RootTab.Comprehensive.route) == true || currentRoute?.startsWith("comprehensive/") == true
                                      RootTab.OtherBusiness -> currentRoute == tab.route || currentRoute?.startsWith("other/") == true
                                      RootTab.Settings -> currentRoute == tab.route || currentRoute?.startsWith("settings/") == true
                                      else -> currentRoute == tab.route
                                  }
                                  NavigationBarItem(
                                      selected = selected,
                                      onClick = {
                                          navController.navigate(tab.route) {
                                              popUpTo(RootTab.Flow.route) { saveState = true }
                                              launchSingleTop = true
                                              restoreState = true
                                          }
                                      },
                                      icon = { Text(text = tab.glyph, fontSize = 19.sp) },
                                      label = { Text(text = tab.label) },
                                      colors = NavigationBarItemDefaults.colors(
                                          selectedIconColor = MaterialTheme.colorScheme.primary,
                                          selectedTextColor = MaterialTheme.colorScheme.primary,
                                          unselectedIconColor = MaterialTheme.colorScheme.onSurfaceVariant,
                                          unselectedTextColor = MaterialTheme.colorScheme.onSurfaceVariant,
                                          indicatorColor = Color.Transparent,
                                      ),
                                  )
                              }
                          }
                      },'''
          new_bottom = '''            bottomBar = {
                          RootBottomTabBar(
                              currentRoute = currentRoute,
                              onSelect = { tab ->
                                  navController.navigate(tab.route) {
                                      popUpTo(RootTab.Flow.route) { saveState = true }
                                      launchSingleTop = true
                                      restoreState = true
                                  }
                              },
                          )
                      },'''
          r = must_replace(r, old_bottom, new_bottom, 'root bottom bar block')

          helper_anchor = '@Composable\nfun ChinaUnicomApp() {'
          helper = r'''@Composable
          private fun RootBottomTabBar(
              currentRoute: String?,
              onSelect: (RootTab) -> Unit,
          ) {
              val selectedBlue = Color(0xFF2E66F2)
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .navigationBarsPadding()
                      .padding(horizontal = 24.dp, vertical = 6.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  Surface(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(58.dp),
                      shape = RoundedCornerShape(30.dp),
                      color = MaterialTheme.colorScheme.surface.copy(alpha = 0.96f),
                      tonalElevation = 0.dp,
                      shadowElevation = 10.dp,
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 4.dp, vertical = 3.dp),
                          horizontalArrangement = Arrangement.spacedBy(2.dp),
                          verticalAlignment = Alignment.CenterVertically,
                      ) {
                          RootTab.entries.forEach { tab ->
                              val selected = when (tab) {
                                  RootTab.Comprehensive -> currentRoute?.startsWith(RootTab.Comprehensive.route) == true || currentRoute?.startsWith("comprehensive/") == true
                                  RootTab.OtherBusiness -> currentRoute == tab.route || currentRoute?.startsWith("other/") == true
                                  RootTab.Settings -> currentRoute == tab.route || currentRoute?.startsWith("settings/") == true
                                  else -> currentRoute == tab.route
                              }
                              Surface(
                                  modifier = Modifier
                                      .weight(1f)
                                      .height(52.dp),
                                  onClick = { onSelect(tab) },
                                  shape = RoundedCornerShape(26.dp),
                                  color = if (selected) selectedBlue.copy(alpha = 0.085f) else Color.Transparent,
                              ) {
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      verticalArrangement = Arrangement.Center,
                                  ) {
                                      Text(
                                          text = tab.glyph,
                                          fontSize = 20.sp,
                                          lineHeight = 22.sp,
                                          fontWeight = FontWeight.Medium,
                                          color = if (selected) selectedBlue else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.88f),
                                      )
                                      Text(
                                          text = tab.label,
                                          fontSize = 10.5.sp,
                                          lineHeight = 13.sp,
                                          fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,
                                          color = if (selected) selectedBlue else MaterialTheme.colorScheme.onSurface.copy(alpha = 0.78f),
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }

          '''
          if helper_anchor not in r:
              raise SystemExit('missing root helper anchor')
          r = r.replace(helper_anchor, helper + helper_anchor, 1)
          root_path.write_text(r)

          # Force text presentation for symbols that otherwise become colored emoji on Android.
          tab_path = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/navigation/RootTab.kt')
          t = tab_path.read_text()
          t = t.replace('glyph = "☎"', 'glyph = "☎︎"')
          t = t.replace('glyph = "⚙"', 'glyph = "⚙︎"')
          tab_path.write_text(t)
          PY

      - name: Commit visual refinement
        shell: bash
        run: |
