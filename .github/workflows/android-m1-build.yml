name: Android M1 Build

on:
  push:
    branches:
      - migration/android-m1-skeleton
  pull_request:
    paths:
      - "app/**"
      - "core/design/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-m1-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        shell: bash
        run: |
          echo "RUNNER_PROBE=PASS"
          uname -a

  assemble-debug:
    needs: runner-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Assemble M1 debug APK
        id: build
        continue-on-error: true
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish M1 build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.build.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m1-build',
              description: passed ? 'M1 assembleDebug passed' : 'M1 assembleDebug failed or did not run'
            });

      - name: Fail workflow when build failed
        if: always() && steps.build.outcome != 'success'
        run: exit 1
