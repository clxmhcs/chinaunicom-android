name: Android M1 Build

on:
  push:
    branches:
      - migration/android-m1-skeleton
  pull_request:
    paths:
      - "app/**"
      - "core/design/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-m1-build.yml"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Assemble M1 debug APK
        run: gradle :app:assembleDebug --stacktrace
