name: Android M1 Build

on:
  push:
    branches:
      - migration/android-m1-skeleton
  pull_request:
    paths:
      - "app/**"
      - "core/design/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-m1-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  runner-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        shell: bash
        run: |
          echo "RUNNER_PROBE=PASS"
          uname -a

  assemble-debug:
    needs: runner-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Discover Android 17 preview SDK package
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager --list --channel=3 | grep -Ei 'cinnamon|android-37|platforms;android|build-tools;37' || true

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && (tolower($0) ~ /cinnamon/ || $1 ~ /android-37/) {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Android 17/API 37 preview platform package was not found."
            exit 1
          fi
          echo "ANDROID_17_PLATFORM_PACKAGE=$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify fake repository is debug-only
        shell: bash
        run: |
          if grep -RInE 'FakeUnicomRepository|mock-flow-|18600009025|896\.87|测试号码' app/src/main app/src/release; then
            echo "ERROR: fake repository fixture leaked into main/release sources."
            exit 1
          fi
          test -f app/src/debug/java/com/clxmhcs/chinaunicom/data/FakeUnicomRepository.kt
          echo "FAKE_REPOSITORY_ISOLATION=PASS"

      - name: Assemble M1 debug and release APKs
        id: build
        continue-on-error: true
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Publish M1 build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.build.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m1-build',
              description: passed ? 'M1 debug/release assemble passed' : 'M1 debug/release assemble failed or did not run'
            });

      - name: Fail workflow when build failed
        if: always() && steps.build.outcome != 'success'
        run: exit 1
