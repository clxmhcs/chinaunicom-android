name: Android M9 H Video Ring

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "core/security/**"
      - "data/settings/**"
      - "data/videoring/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-h-video-ring-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "core/security/**"
      - "data/settings/**"
      - "data/videoring/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-h-video-ring-build.yml"

permissions:
  contents: read

jobs:
  m9-h-video-ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-H active-inline source boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/VideoRingModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomVideoRingClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/VideoRingAccountCredentialLifecycle.kt
          CACHE=data/videoring/src/main/kotlin/com/clxmhcs/chinaunicom/data/videoring/AndroidVideoRingDiskCache.kt
          STORE=data/videoring/src/main/kotlin/com/clxmhcs/chinaunicom/data/videoring/VideoRingStore.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/VideoRingRefreshSettings.kt
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/VideoRingViewModel.kt
          UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/VideoRingScreens.kt
          OTHER=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          BUILD=app/build.gradle.kts
          for file in "$MODEL" "$CLIENT" "$LIFECYCLE" "$CACHE" "$STORE" "$SETTINGS" "$VM" "$UI" "$OTHER" "$APP" "$BUILD"; do test -f "$file"; done

          grep -q 'include(":data:videoring")' settings.gradle.kts
          grep -q 'minSdk = 30' data/videoring/build.gradle.kts
          grep -q 'minSdk = 30' "$BUILD"
          grep -Eq 'versionName = "0\.9\.0-m9h[0-9a-z.-]*"' "$BUILD"
          grep -q 'implementation(project(":data:videoring"))' "$BUILD"

          grep -q 'edop_unicom_c43eac06' "$CLIENT"
          grep -q 'https://m.client.10010.com/edop_ng/getTicketByNative' "$CLIENT"
          grep -q 'https://m.10155.com' "$CLIENT"
          grep -q '/woapp/login/ecsAppletLogin' "$CLIENT"
          grep -q '/woapp/h5/woMember/getClientMemberInfosByUserId' "$CLIENT"
          grep -q '/woapp/uc/getmemberinfo' "$CLIENT"
          ! grep -q '/woapp/videoRing/getCrbtFlag' "$CLIENT"
          ! grep -q '/woapp/h5/woMember/getMemberDetail' "$CLIENT"
          grep -q 'VNEU8G4V' "$CLIENT"
          grep -q 'OS_WO_VERSION = "1018"' "$CLIENT"
          grep -q 'timestamp' "$CLIENT"
          grep -q 'nonce' "$CLIENT"
          grep -q 'sign' "$CLIENT"
          grep -q 'MessageDigest.getInstance("MD5")' "$CLIENT"
          grep -q 'Accept-Language' "$CLIENT"
          grep -q 'ChinaUnicom4.x/12.14' "$CLIENT"
          grep -q 'EphemeralVideoRingCookieJar' "$CLIENT"
          grep -q 'transportFactory' "$CLIENT"
          grep -q 'UnicomCookieCodec.value("ecs_token"' "$CLIENT"
          grep -q 'AccountMismatch' "$CLIENT"
          grep -q 'normalizedCaller != expected' "$CLIENT"
          grep -q 'put("uid", clientUID)' "$CLIENT"
          grep -q 'put("accessToken", normalizedBearerToken' "$CLIENT"
          ! grep -q 'put("Authorization"' "$CLIENT"

          grep -q 'credentialStore.read(accountID)' "$LIFECYCLE"
          grep -q 'credentialStore.save(accountID, it)' "$LIFECYCLE"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"
          grep -q 'AtomicFile' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          grep -q 'VideoRingCacheRecord' "$CACHE"
          grep -q 'REFRESH_WHEN_EXPIRED' "$STORE"
          grep -q 'MANUAL_ONLY' "$STORE"
          grep -q 'cacheValidityMinutes' "$STORE"
          grep -q 'videoRing' "$SETTINGS"
          grep -q 'PageEntryRefreshMode.EVERY_ENTRY' "$SETTINGS"
          grep -q 'cacheValidityMinutes: Int = 60' "$SETTINGS"
          grep -q 'AndroidSettingsRepositories.refreshLogic' "$VM"
          grep -q 'getOrCreateVideoRingClientUID' "$VM"
          grep -q 'UnicomVideoRingClient(clientUID)' "$VM"

          grep -q 'OtherBusinessEntry("视频彩铃会员", enabled = true)' "$OTHER"
          grep -q 'onOpenVideoRing' "$OTHER"
          grep -q 'OTHER_VIDEO_RING_ROUTE = "other/video-ring"' "$APP"
          grep -q 'OTHER_VIDEO_RING_DETAIL_ROUTE = "other/video-ring/{accountId}"' "$APP"
          grep -q 'VideoRingAccountSelectionScreen(' "$APP"
          grep -q 'VideoRingMemberCenterScreen(' "$APP"
          grep -q 'digits.length == 11 && digits.startsWith("1")' "$UI"
          grep -q 'AI彩铃视听剧场会员' "$UI"
          grep -q '铂金会员' "$UI"
          grep -q 'AI彩铃升级版' "$UI"
          grep -q 'startTime' "$UI"
          grep -q 'endTime' "$UI"
          if grep -R -nE 'cookie|tokenOnline|appID|token_online|password|smsCode' "$VM" "$UI" "$STORE"; then
            echo "M9-H Compose/ViewModel/business state must not expose credential material"
            exit 1
          fi
          echo "M9_H_VIDEO_RING_ACTIVE_INLINE_BOUNDARY=PASS"

      - name: Run M9-H regression
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:login:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:videoring:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace
