name: UI17 Settings Version Fix

on:
  push:
    branches:
      - ui-17-settings-ios-refinement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-17-settings-ios-refinement
      - name: Replace BuildConfig version lookup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.ui.res.painterResource\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.painterResource\n')
          s = s.replace('import com.clxmhcs.chinaunicom.BuildConfig\n', '')
          anchor = '    val settings by settingsViewModel.appSettings.collectAsState()\n'
          insert = '''    val context = LocalContext.current\n    val packageInfo = remember(context.packageName) {\n        context.packageManager.getPackageInfo(context.packageName, 0)\n    }\n    val installedAppVersion = "${packageInfo.versionName ?: "1.0"} (${packageInfo.longVersionCode})"\n\n'''
          if anchor not in s:
              raise SystemExit('settings state anchor not found')
          s = s.replace(anchor, insert + anchor, 1)
          old = 'detail = "${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})",'
          if old not in s:
              raise SystemExit('BuildConfig version row anchor not found')
          s = s.replace(old, 'detail = installedAppVersion,', 1)
          p.write_text(s)
          Path('.github/workflows/ui17-settings-version-fix.yml').unlink()
          PY
      - name: Commit fix and cleanup workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsRootIosScreen.kt .github/workflows/ui17-settings-version-fix.yml
          git commit -m 'UI-17: read installed app version from package manager'
          git push origin HEAD:ui-17-settings-ios-refinement
