name: UI08 guarded balance breathing patch

on:
  push:
    branches:
      - ui-08-balance-breathing-animation
    paths:
      - .github/workflows/ui08-patch-balance-breathing.yml

permissions:
  contents: write

jobs:
  patch-balance-breathing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-08-balance-breathing-animation
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: bash
        run: |
          python3 .github/scripts/ui08_patch_balance_breathing.py
          rm .github/workflows/ui08-patch-balance-breathing.yml
          rm .github/scripts/ui08_patch_balance_breathing.py

      - name: Commit source change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowHomeScreen.kt .github/workflows/ui08-patch-balance-breathing.yml .github/scripts/ui08_patch_balance_breathing.py
          git diff --cached --check
          git commit -m 'UI-08: match iOS balance breathing animation'
          git push origin HEAD:ui-08-balance-breathing-animation
