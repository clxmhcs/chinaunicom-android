name: Temporary UI-27 quota patch

on:
  push:
    branches:
      - ui-27-quota-refresh-ios-refinement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-27-quota-refresh-ios-refinement
          fetch-depth: 0
      - name: Apply quota correctness fix
        run: python3 tools/tmp_ui27_quota_fix.py
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRefreshCoordinator.kt \
                  data/refresh/src/main/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRepository.kt \
                  app/src/main/java/com/clxmhcs/chinaunicom/data/UnicomRepository.kt \
                  data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt \
                  data/settings/src/test/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepositoryTest.kt \
                  data/refresh/src/test/kotlin/com/clxmhcs/chinaunicom/data/refresh/QuotaRefreshCoordinatorTest.kt \
                  docs/migration/M6_BASELINE.md
          git commit -m 'UI-27 align quota timing defaults and tests with current iOS'
          git push origin HEAD:ui-27-quota-refresh-ios-refinement
