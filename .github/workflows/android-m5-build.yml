name: Android M5 Login Security

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/security/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "docs/migration/M5_BASELINE.md"
      - "README.md"
      - ".github/workflows/android-m5-build.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/security/**"
      - "settings.gradle.kts"
      - "docs/migration/M5_BASELINE.md"
      - ".github/workflows/android-m5-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  security-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "ERROR: Android API 37 platform package was not found."
            exit 1
          fi
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M5 security and login protocol boundary
        shell: bash
        run: |
          test -f core/security/src/main/kotlin/com/clxmhcs/chinaunicom/core/security/AndroidCredentialStore.kt
          test -f core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomSMSLoginSession.kt
          test -f core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          test -f core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomLoginRSAEncryptor.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/data/AndroidLoginDeviceIdentityStore.kt
          test -f app/src/main/java/com/clxmhcs/chinaunicom/data/PasswordLoginSessionProvider.kt

          grep -q 'AndroidKeyStore' core/security/src/main/kotlin/com/clxmhcs/chinaunicom/core/security/AndroidCredentialStore.kt
          grep -q 'AES/GCM/NoPadding' core/security/src/main/kotlin/com/clxmhcs/chinaunicom/core/security/AndroidCredentialStore.kt
          grep -q 'AndroidKeystoreCredentialCipher' app/src/main/java/com/clxmhcs/chinaunicom/data/AndroidLoginDeviceIdentityStore.kt
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

          grep -q 'https://loginxx.10010.com/mobileService/sendRadomNum.htm' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomSMSLoginSession.kt
          grep -q 'https://loginxx.10010.com/mobileService/radomLogin.htm' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomSMSLoginSession.kt
          grep -q 'https://loginxx.10010.com/login-web/v1/switch/getSwitch' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomSMSLoginSession.kt
          grep -q 'ECS99998' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomSMSLoginSession.kt

          grep -q 'https://loginxx.10010.com/mobileService/login.htm' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'https://loginxx.10010.com/login-web/v1/switch/getSwitch' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'ECS99999' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'isRemberPwd' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'netWay.*wifi' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'message.contains("ECS11721")' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'message.contains("短信验证码")' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt
          grep -q 'PlaintextTooLong' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomPasswordLoginSession.kt

          grep -q 'RSA/ECB/PKCS1Padding' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomLoginRSAEncryptor.kt
          grep -q 'MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDc+CZK9bBA9IU+gZUO' core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomLoginRSAEncryptor.kt

          if grep -RInE 'putString\([^\n]*(cookie|tokenOnline|token_online|password|smsCode|verificationCode|resultToken)' app/src/main core/security/src/main; then
            echo "ERROR: secret login/account field appears to be written directly to SharedPreferences."
            exit 1
          fi
          echo "M5_SECURITY_LOGIN_BOUNDARY=PASS"

      - name: Run M5 regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:security:testDebugUnitTest
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M5 security status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m5-security',
              description: passed ? 'M5 security/login tests + debug/release assemble passed' : 'M5 security/login regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow when M5 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
