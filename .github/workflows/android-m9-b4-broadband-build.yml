name: Android M9 B4 Broadband Account Core

on:
  pull_request:
    branches: [main]
    paths:
      - "data/broadbandaccount/**"
      - "app/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-b4-broadband-build.yml"
  push:
    branches: [main]
    paths:
      - "data/broadbandaccount/**"
      - "app/**"
      - "settings.gradle.kts"
      - ".github/workflows/android-m9-b4-broadband-build.yml"

permissions:
  contents: read

jobs:
  broadband-account-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-B4-A broadband account core boundary
        shell: bash
        run: |
          INFO=data/broadbandaccount/src/main/kotlin/com/clxmhcs/chinaunicom/data/broadbandaccount/BroadbandAccountInfo.kt
          REPO=data/broadbandaccount/src/main/kotlin/com/clxmhcs/chinaunicom/data/broadbandaccount/BroadbandAccountRepository.kt
          LIFE=data/broadbandaccount/src/main/kotlin/com/clxmhcs/chinaunicom/data/broadbandaccount/BroadbandAccountLifecycle.kt
          TEST=data/broadbandaccount/src/test/kotlin/com/clxmhcs/chinaunicom/data/broadbandaccount/BroadbandAccountCoreTest.kt
          for file in "$INFO" "$REPO" "$LIFE" "$TEST"; do test -f "$file"; done
          grep -q 'include(":data:broadbandaccount")' settings.gradle.kts
          grep -q 'minSdk = 30' data/broadbandaccount/build.gradle.kts
          grep -q 'AtomicFile' "$REPO"
          grep -q 'stream.fd.sync()' "$REPO"
          grep -q 'CredentialStore' "$LIFE"
          grep -q 'api.fetchQuota(credentials)' "$LIFE"
          grep -q 'updatedCredentials ?: credentials' "$LIFE"
          grep -q 'previousCredentials' "$LIFE"
          grep -q 'credentialStore.delete(record.id)' "$LIFE"
          grep -q 'fun toUnicomAccount()' "$INFO"
          grep -q 'packageName = "宽带账号"' "$INFO"
          ! grep -Eq 'val (cookie|appID|tokenOnline)' "$INFO"
          ! grep -Eqi 'cookie|token_online|appId' "$REPO"

      - name: Verify M9-B4-B settings and MyPackage wiring
        shell: bash
        run: |
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/BroadbandAccountViewModel.kt
          SETTINGS=app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsAccountScreen.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          PACKAGE=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyPackageScreen.kt
          for file in "$VM" "$SETTINGS" "$APP" "$PACKAGE"; do test -f "$file"; done
          grep -q 'implementation(project(":data:broadbandaccount"))' app/build.gradle.kts
          grep -Eq 'versionName = "0\.9\.0-m9[a-z][0-9]+"' app/build.gradle.kts
          grep -q 'BroadbandAccountLifecycle' "$VM"
          grep -q 'CredentialStoreProvider.create' "$VM"
          grep -q 'Dispatchers.IO' "$VM"
          grep -q 'BroadbandAccountDraft' "$SETTINGS"
          grep -q 'PasswordVisualTransformation' "$SETTINGS"
          grep -q 'broadbandState.accounts.map { it.toUnicomAccount() }' "$APP"
          grep -q 'broadbandAccountViewModel: BroadbandAccountViewModel = viewModel()' "$APP"
          grep -q 'account.isBroadbandTarget()' "$PACKAGE"
          grep -q 'MyPackageResourceTab.BROADBAND.name' "$PACKAGE"
          grep -q '手机账号和独立宽带账号' "$PACKAGE"
          ! grep -Eq 'broadband(Cookie|AppID|TokenOnline).*rememberSaveable' "$SETTINGS"
          ! grep -Eq 'cookie|tokenOnline|appID' data/broadbandaccount/src/main/kotlin/com/clxmhcs/chinaunicom/data/broadbandaccount/BroadbandAccountInfo.kt

      - name: Run M9-B4 regression
        run: ./gradlew :data:broadbandaccount:testDebugUnitTest :core:security:testDebugUnitTest :core:network:testDebugUnitTest :data:mypackage:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
