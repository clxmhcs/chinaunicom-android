name: Android M12 Widget

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "widget/**"
      - "core/model/**"
      - "data/refresh/**"
      - "data/settings/**"
      - "data/integral/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - ".github/workflows/android-m12-widget-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "widget/**"
      - "core/model/**"
      - "data/refresh/**"
      - "data/settings/**"
      - "data/integral/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - ".github/workflows/android-m12-widget-build.yml"

permissions:
  contents: read

jobs:
  m12-widget:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M12 Widget authority boundary
        shell: bash
        run: |
          APP_BUILD=app/build.gradle.kts
          SETTINGS=settings.gradle.kts
          VERSIONS=gradle/libs.versions.toml
          WIDGET_BUILD=widget/build.gradle.kts
          MANIFEST=widget/src/main/AndroidManifest.xml
          SINGLE_XML=widget/src/main/res/xml/single_quota_widget_info.xml
          DUAL_XML=widget/src/main/res/xml/dual_quota_widget_info.xml
          MODELS=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/WidgetSnapshotModels.kt
          STORE=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/WidgetSnapshotStore.kt
          EXPORTER=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/WidgetSnapshotExporter.kt
          BUILDER=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/WidgetSnapshotBuilder.kt
          DAILY=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/WidgetDailyUsageCalculator.kt
          GLANCE=widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/QuotaWidgets.kt
          PROD=app/src/main/java/com/clxmhcs/chinaunicom/data/ProductionUnicomRepository.kt
          RELEASE=app/src/release/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          DEBUG=app/src/debug/java/com/clxmhcs/chinaunicom/data/UnicomRepositoryProvider.kt
          SETTINGS_VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/SettingsM11CViewModel.kt
          for file in "$APP_BUILD" "$SETTINGS" "$VERSIONS" "$WIDGET_BUILD" "$MANIFEST" "$SINGLE_XML" "$DUAL_XML" "$MODELS" "$STORE" "$EXPORTER" "$BUILDER" "$DAILY" "$GLANCE" "$PROD" "$RELEASE" "$DEBUG" "$SETTINGS_VM"; do test -f "$file"; done

          grep -q 'minSdk = 30' "$WIDGET_BUILD"
          grep -q 'include(":widget")' "$SETTINGS"
          grep -q 'glance = "1.2.0"' "$VERSIONS"
          grep -q 'implementation(project(":widget"))' "$APP_BUILD"
          grep -q 'SingleQuotaWidgetReceiver' "$MANIFEST"
          grep -q 'DualQuotaWidgetReceiver' "$MANIFEST"
          grep -q 'android:updatePeriodMillis="0"' "$SINGLE_XML"
          grep -q 'android:updatePeriodMillis="0"' "$DUAL_XML"
          grep -q 'AtomicFile' "$STORE"
          grep -q 'WidgetSnapshotExporter' "$EXPORTER"
          grep -q 'WidgetDailyUsageCalculator' "$DAILY"
          grep -q 'AndroidDailyUsageBaselineStore' "$DAILY"
          grep -q 'WidgetSnapshotBuilder' "$BUILDER"
          grep -q 'SingleQuotaGlanceWidget' "$GLANCE"
          grep -q 'DualQuotaGlanceWidget' "$GLANCE"
          grep -q 'accountsCommittedAction' "$PROD"
          grep -q 'WidgetSnapshotExporter' "$RELEASE"
          grep -q 'WidgetSnapshotExporter' "$DEBUG"
          grep -q 'widgetSnapshotExporter.export' "$SETTINGS_VM"

          ! grep -Eqi 'token_online|idcardlastsix|cookie[[:space:]]*[:=]|appid[[:space:]]*[:=]' "$MODELS"
          ! grep -Eqi 'token_online|idcardlastsix|cookie[[:space:]]*[:=]|appid[[:space:]]*[:=]' "$STORE"
          ! grep -Eqi 'm\.client\.10010\.com|m\.10155\.com|ecstest2018|okhttp3\.Request' widget/src/main/kotlin/com/clxmhcs/chinaunicom/widget/*.kt
          echo "M12_WIDGET_BOUNDARY=PASS"

      - name: Run M12 Widget regression
        run: >-
          gradle
          :widget:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace
