name: Android M9 Other Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/settings/**"
      - "data/balance/**"
      - "data/myorder/**"
      - "data/mypackage/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/settings/**"
      - "data/balance/**"
      - "data/myorder/**"
      - "data/mypackage/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  other-business-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-A My Order permanent boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyOrderModels.kt
          DETAIL_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyOrderDetailModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomMyOrderClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyOrderAccountCredentialLifecycle.kt
          DETAIL_LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyOrderDetailCredentialLifecycle.kt
          STORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderStore.kt
          DETAIL_STORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailStore.kt
          DETAIL_PARSER=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailParser.kt
          DETAIL_CORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailCore.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt
          SETTINGS_ADAPTER=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/SettingsMyOrderEntryRefreshPolicy.kt
          APP_VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderViewModel.kt
          OTHER_UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          LIST_UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderScreen.kt
          DETAIL_UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyOrderDetailScreen.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt

          for file in "$MODEL" "$DETAIL_MODEL" "$CLIENT" "$LIFECYCLE" "$DETAIL_LIFECYCLE" "$STORE" "$DETAIL_STORE" "$DETAIL_PARSER" "$DETAIL_CORE" "$SETTINGS" "$SETTINGS_ADAPTER" "$APP_VM" "$OTHER_UI" "$LIST_UI" "$DETAIL_UI" "$APP"; do test -f "$file"; done
          grep -q 'include(":data:myorder")' settings.gradle.kts
          grep -q 'minSdk = 30' data/myorder/build.gradle.kts
          grep -q 'implementation(project(":data:myorder"))' app/build.gradle.kts
          grep -q '/mobileservicequery/order/newQueryOrder' "$CLIENT"
          grep -q '"loginNumber" to md5' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"
          grep -q 'StateFlow<MyOrderStoreState>' "$STORE"
          grep -q 'entryRefreshPolicy.refreshOnEntry()' "$STORE"
          grep -q 'loadMoreIfNeeded' "$STORE"
          grep -q 'data class OrderRefreshPolicy' "$SETTINGS"
          grep -q 'val refreshOnEntry: Boolean = true' "$SETTINGS"
          grep -q 'BUSINESS("business")' "$DETAIL_MODEL"
          grep -q 'RENEWAL("renewal")' "$DETAIL_MODEL"
          grep -q 'UNSUPPORTED("unsupported")' "$DETAIL_MODEL"
          grep -q '/udbh/rest/portal/qryEvaluateOrderInfoByOrderId' "$DETAIL_CORE"
          grep -q 'broaRenewalInfo' "$DETAIL_CORE"
          grep -q 'onOpenMyOrder = ' "$APP"
          grep -q 'private const val MY_ORDER_ROUTE = "other/my-order"' "$APP"
          grep -q 'MyOrderScreen(' "$APP"
          grep -q 'MyOrderDetailScreen(' "$APP"
          grep -q 'loadMoreIfNeeded' "$LIST_UI"
          grep -q 'CookieManager.getInstance' "$DETAIL_UI"
          grep -q 'value.endsWith(".10010.com")' "$DETAIL_UI"
          grep -q 'Max-Age=0; Domain=.10010.com' "$DETAIL_UI"
          if find data/myorder/src/main -type f -iname '*cache*' | grep -q .; then
            echo "M9-A must not invent a My Order disk cache"
            exit 1
          fi
          echo "M9_A_MY_ORDER_PERMANENT_GATE=PASS"

      - name: Verify M9-B1 My Package permanent core boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyPackageModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomMyPackageClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyPackageAccountCredentialLifecycle.kt
          STORE=data/mypackage/src/main/kotlin/com/clxmhcs/chinaunicom/data/mypackage/MyPackageStore.kt
          CACHE=data/mypackage/src/main/kotlin/com/clxmhcs/chinaunicom/data/mypackage/MyPackageDiskCache.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt

          for file in "$MODEL" "$CLIENT" "$LIFECYCLE" "$STORE" "$CACHE" "$SETTINGS"; do test -f "$file"; done
          grep -q 'include(":data:mypackage")' settings.gradle.kts
          grep -q 'minSdk = 30' data/mypackage/build.gradle.kts
          grep -q 'queryPackage/myPackage' "$CLIENT"
          grep -q 'queryPackage/myResourceDetails' "$CLIENT"
          grep -q 'queryPackage/myMemberMobile' "$CLIENT"
          grep -q 'queryPackage/myPrettyNumber' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q '#user3ExtraInfo6' "$CLIENT"
          grep -q 'AES/CBC/NoPadding' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'fetchOptionalRoot' "$CLIENT"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"
          grep -q 'enum class PageEntryRefreshMode' "$SETTINGS"
          grep -q 'EVERY_ENTRY("everyEntry")' "$SETTINGS"
          grep -q 'REFRESH_WHEN_EXPIRED("refreshWhenExpired")' "$SETTINGS"
          grep -q 'MANUAL_ONLY("manualOnly")' "$SETTINGS"
          grep -q 'data class MyPackageRefreshPolicy' "$SETTINGS"
          grep -q 'MY_PACKAGE_KEY = "myPackage"' "$SETTINGS"
          grep -q 'PageEntryRefreshMode.EVERY_ENTRY' "$STORE"
          grep -q 'PageEntryRefreshMode.REFRESH_WHEN_EXPIRED' "$STORE"
          grep -q 'PageEntryRefreshMode.MANUAL_ONLY' "$STORE"
          grep -q 'MyPackageRefreshState.Warning' "$STORE"
          grep -q 'AtomicFile' "$CACHE"
          grep -q 'SCHEMA_VERSION = 1' "$CACHE"
          grep -q 'stream.fd.sync()' "$CACHE"
          if grep -R -nE 'token_online|password|smsCode|Cookie' data/mypackage/src/main; then
            echo "M9-B My Package business/cache state must not contain raw credential material"
            exit 1
          fi
          echo "M9_B1_MY_PACKAGE_CORE_PERMANENT_GATE=PASS"

      - name: Verify M9-B2 My Package rough functional wiring
        shell: bash
        run: |
          VM=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyPackageViewModel.kt
          UI=app/src/main/java/com/clxmhcs/chinaunicom/ui/MyPackageScreen.kt
          OTHER=app/src/main/java/com/clxmhcs/chinaunicom/ui/OtherBusinessScreen.kt
          APP=app/src/main/java/com/clxmhcs/chinaunicom/ui/ChinaUnicomApp.kt
          BUILD=app/build.gradle.kts
          for file in "$VM" "$UI" "$OTHER" "$APP" "$BUILD"; do test -f "$file"; done

          grep -q 'implementation(project(":data:mypackage"))' "$BUILD"
          grep -q 'minSdk = 30' "$BUILD"
          grep -q 'versionName = "0.9.0-m9b2"' "$BUILD"
          grep -q 'MyPackageAccountCredentialLifecycle' "$VM"
          grep -q 'CredentialStoreProvider.create' "$VM"
          grep -q 'AndroidMyPackageDiskCache' "$VM"
          grep -q 'SettingsMyPackagePolicyProvider' "$VM"
          grep -q 'DefaultMyPackageStore' "$VM"
          grep -q 'packageStore.load' "$VM"
          grep -q 'packageStore.refresh' "$VM"
          grep -q 'packageStore.clear' "$VM"

          grep -q 'OtherBusinessEntry("我的套餐", enabled = true)' "$OTHER"
          grep -q 'onOpenMyPackage' "$OTHER"
          grep -q 'private const val MY_PACKAGE_ROUTE = "other/my-package"' "$APP"
          grep -q 'onOpenMyPackage = { navController.navigate(MY_PACKAGE_ROUTE) }' "$APP"
          grep -q 'MyPackageScreen(' "$APP"
          grep -q 'val myPackageViewModel: MyPackageViewModel = viewModel()' "$APP"

          grep -q '选择要查询的号码' "$UI"
          grep -q '正在查询我的套餐' "$UI"
          grep -q '套餐查询失败' "$UI"
          grep -q '套外计费规则' "$UI"
          grep -q '宽带号码' "$UI"
          grep -q '套餐速率' "$UI"
          grep -q '业务规则' "$UI"
          grep -q '我的合约' "$UI"
          grep -q '合约剩余天数' "$UI"
          grep -q '查看完整号码' "$UI"
          grep -q '完整号码需要短信验证' "$UI"
          grep -q 'group.groupType == "05"' "$UI"
          grep -q '查看更多' "$UI"
          grep -q '我的靓号' "$UI"
          grep -q 'viewModel.refresh' "$UI"
          grep -q 'viewModel.clear' "$UI"
          if grep -R -nE 'token_online|password|smsCode|Cookie' "$VM" "$UI"; then
            echo "M9-B2 Compose/ViewModel state must not expose raw credential material"
            exit 1
          fi
          echo "M9_B2_MY_PACKAGE_FUNCTIONAL_WIRING_GATE=PASS"

      - name: Run M9-B2 regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :data:integral:testDebugUnitTest
          :data:comprehensive:testDebugUnitTest
          :data:myorder:testDebugUnitTest
          :data:mypackage:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M9-B2 status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m9-other-business',
              description: passed ? 'M9-B2 My Package functional wiring passed' : 'M9-B2 My Package regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M9-B2 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
