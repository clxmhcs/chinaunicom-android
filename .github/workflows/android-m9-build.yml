name: Android M9 Other Business

on:
  pull_request:
    branches: [main]
    paths:
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/myorder/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"
  push:
    branches: [main]
    paths:
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/myorder/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  my-order-core-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-A1 My Order source boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyOrderModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomMyOrderClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyOrderAccountCredentialLifecycle.kt
          STORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderStore.kt

          test -f "$MODEL"
          test -f "$CLIENT"
          test -f "$LIFECYCLE"
          test -f "$STORE"
          grep -q 'include(":data:myorder")' settings.gradle.kts
          grep -q 'minSdk = 30' data/myorder/build.gradle.kts

          grep -q 'https://m.client.10010.com' "$CLIENT"
          grep -q '/mobileservicequery/order/newQueryOrder' "$CLIENT"
          grep -q '"current_page"' "$CLIENT"
          grep -q '"page_size"' "$CLIENT"
          grep -q '"loginNumber" to md5' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"
          grep -q 'respCode' "$CLIENT"
          grep -q 'timeYear' "$CLIENT"

          grep -q 'CredentialStore' "$LIFECYCLE"
          grep -q 'credentialStore.save' "$LIFECYCLE"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"

          grep -q 'StateFlow<MyOrderStoreState>' "$STORE"
          grep -q 'entryRefreshPolicy.refreshOnEntry()' "$STORE"
          grep -q 'UnicomMyOrderClient.DEFAULT_PAGE_SIZE' "$STORE"
          grep -q 'loadMoreIfNeeded' "$STORE"
          grep -q 'unique(merged)' "$STORE"
          if find data/myorder/src/main -type f -iname '*cache*' | grep -q .; then
            echo "M9-A1 must not invent a My Order disk cache because iOS MyOrderStore is in-memory only"
            exit 1
          fi

          echo "M9_A1_MY_ORDER_CORE_GATE=PASS"

      - name: Run M9-A1 regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :data:integral:testDebugUnitTest
          :data:comprehensive:testDebugUnitTest
          :data:myorder:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M9-A1 status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m9-my-order-core',
              description: passed ? 'M9-A1 My Order core gate passed' : 'M9-A1 My Order core regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M9-A1 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
