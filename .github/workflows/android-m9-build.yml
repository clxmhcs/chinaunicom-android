name: Android M9 Other Business

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/settings/**"
      - "data/balance/**"
      - "data/myorder/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/model/**"
      - "core/network/**"
      - "core/login/**"
      - "data/settings/**"
      - "data/balance/**"
      - "data/myorder/**"
      - "settings.gradle.kts"
      - "docs/migration/M9_BASELINE.md"
      - ".github/workflows/android-m9-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  my-order-core-test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Ensure Android API 37 SDK
        shell: bash
        run: |
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk -F'|' '/platforms;android-/ && $1 ~ /android-37/ {gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE"

      - name: Verify M9-A1/A2 My Order source boundary
        shell: bash
        run: |
          MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyOrderModels.kt
          DETAIL_MODEL=core/model/src/main/kotlin/com/clxmhcs/chinaunicom/core/model/MyOrderDetailModels.kt
          CLIENT=core/network/src/main/kotlin/com/clxmhcs/chinaunicom/core/network/UnicomMyOrderClient.kt
          LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyOrderAccountCredentialLifecycle.kt
          DETAIL_LIFECYCLE=core/login/src/main/kotlin/com/clxmhcs/chinaunicom/core/login/MyOrderDetailCredentialLifecycle.kt
          STORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderStore.kt
          DETAIL_STORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailStore.kt
          DETAIL_PARSER=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailParser.kt
          DETAIL_CORE=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/MyOrderDetailCore.kt
          SETTINGS=data/settings/src/main/kotlin/com/clxmhcs/chinaunicom/data/settings/SettingsRepository.kt
          SETTINGS_ADAPTER=data/myorder/src/main/kotlin/com/clxmhcs/chinaunicom/data/myorder/SettingsMyOrderEntryRefreshPolicy.kt

          for file in "$MODEL" "$DETAIL_MODEL" "$CLIENT" "$LIFECYCLE" "$DETAIL_LIFECYCLE" "$STORE" "$DETAIL_STORE" "$DETAIL_PARSER" "$DETAIL_CORE" "$SETTINGS" "$SETTINGS_ADAPTER"; do test -f "$file"; done
          grep -q 'include(":data:myorder")' settings.gradle.kts
          grep -q 'minSdk = 30' data/myorder/build.gradle.kts
          grep -q 'implementation(project(":data:settings"))' data/myorder/build.gradle.kts

          grep -q '/mobileservicequery/order/newQueryOrder' "$CLIENT"
          grep -q '"current_page"' "$CLIENT"
          grep -q '"page_size"' "$CLIENT"
          grep -q '"loginNumber" to md5' "$CLIENT"
          grep -q 'iphone_c@12.1400' "$CLIENT"
          grep -q 'sessionClient.activateSession(credentials)' "$CLIENT"
          grep -q 'UnicomCookieCodec.applying' "$CLIENT"
          grep -q 'CredentialStore' "$LIFECYCLE"
          grep -q 'result.copy(updatedCredentials = null)' "$LIFECYCLE"
          grep -q 'StateFlow<MyOrderStoreState>' "$STORE"
          grep -q 'entryRefreshPolicy.refreshOnEntry()' "$STORE"
          grep -q 'UnicomMyOrderClient.DEFAULT_PAGE_SIZE' "$STORE"
          grep -q 'loadMoreIfNeeded' "$STORE"
          grep -q 'unique(merged)' "$STORE"

          grep -q 'data class OrderRefreshPolicy' "$SETTINGS"
          grep -q 'val refreshOnEntry: Boolean = true' "$SETTINGS"
          grep -q 'val orderRefreshPolicy: StateFlow<OrderRefreshPolicy>' "$SETTINGS"
          grep -q 'fun saveOrderRefreshPolicy' "$SETTINGS"
          grep -q 'private const val ORDERS_KEY = "orders"' "$SETTINGS"
          grep -q 'private const val REFRESH_ON_ENTRY_KEY = "refreshOnEntry"' "$SETTINGS"
          grep -q 'const val CURRENT_SCHEMA_VERSION = 3' "$SETTINGS"
          grep -q 'settingsRepository.orderRefreshPolicy.value.refreshOnEntry' "$SETTINGS_ADAPTER"

          grep -q 'BUSINESS("business")' "$DETAIL_MODEL"
          grep -q 'RENEWAL("renewal")' "$DETAIL_MODEL"
          grep -q 'UNSUPPORTED("unsupported")' "$DETAIL_MODEL"
          ! grep -q 'cookieHeader' "$DETAIL_MODEL"
          grep -q 'CredentialStore' "$DETAIL_LIFECYCLE"
          grep -q 'UnicomCookieCodec.normalize' "$DETAIL_LIFECYCLE"
          grep -q 'requireCookieHeader' "$DETAIL_STORE"
          grep -q 'request?.id != requestID' "$DETAIL_STORE"
          grep -q '营业厅订单详情查询失败' "$DETAIL_PARSER"
          grep -q '续约续费订单详情查询失败' "$DETAIL_PARSER"
          grep -q 'statusAttributeName' "$DETAIL_PARSER"
          grep -q 'incomeTotalMoney' "$DETAIL_PARSER"
          grep -q 'broadordersdetail' "$DETAIL_CORE"
          grep -q 'broarenewalinfo' "$DETAIL_CORE"
          grep -q 'qryevaluateorderinfobyorderid' "$DETAIL_CORE"
          grep -q '/udbh/rest/portal/qryEvaluateOrderInfoByOrderId' "$DETAIL_CORE"
          grep -q '/udbh/rest/portal/querySubProducts' "$DETAIL_CORE"
          grep -q "sourcePage: 'CJ_SOU_20000'" "$DETAIL_CORE"
          grep -q 'pageSize: 100' "$DETAIL_CORE"
          grep -q 'broaRenewalInfo' "$DETAIL_CORE"
          grep -q 'request.serviceType ?: "29"' "$DETAIL_CORE"
          grep -q 'queryEvaluateItem' "$DETAIL_CORE"

          if find data/myorder/src/main -type f -iname '*cache*' | grep -q .; then
            echo "M9 must not invent a My Order disk cache because current iOS MyOrderStore is in-memory only"
            exit 1
          fi
          if grep -R -nE 'token_online|password|smsCode' data/myorder/src/main; then
            echo "M9 ordinary data state must not persist credential material"
            exit 1
          fi
          echo "M9_A2_MY_ORDER_DETAIL_CORE_GATE=PASS"

      - name: Run M9-A2 regression
        id: verify
        continue-on-error: true
        run: >-
          gradle
          :core:model:testDebugUnitTest
          :core:parser:testDebugUnitTest
          :core:network:testDebugUnitTest
          :core:security:testDebugUnitTest
          :core:login:testDebugUnitTest
          :core:storage:testDebugUnitTest
          :data:account:testDebugUnitTest
          :data:refresh:testDebugUnitTest
          :data:settings:testDebugUnitTest
          :data:balance:testDebugUnitTest
          :data:orderedbusiness:testDebugUnitTest
          :data:phonebill:testDebugUnitTest
          :data:integral:testDebugUnitTest
          :data:comprehensive:testDebugUnitTest
          :data:myorder:testDebugUnitTest
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          --stacktrace

      - name: Publish M9-A2 status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.verify.outcome }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'android-m9-my-order-core',
              description: passed ? 'M9-A2 My Order settings/detail core passed' : 'M9-A2 My Order core regression failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Fail workflow when M9-A2 verification failed
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
