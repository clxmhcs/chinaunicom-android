name: Fix M5 Captcha H5 Identity

on:
  push:
    branches:
      - m5-sms-captcha-webview-parity
    paths:
      - .github/workflows/m5-captcha-h5-ua-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5-sms-captcha-webview-parity
      - name: Align captcha WebView User-Agent with iOS H5 identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt')
          s = p.read_text()
          old = '''    fun captchaUserAgent(): String {\n        val deviceOS = captchaSystemInfo()["deviceOS"].orEmpty().ifBlank { "18.0" }\n        return "ChinaUnicom4.x/12.14 (com.chinaunicom.mobilebusiness; build:13; iOS $deviceOS) " +\n            "Alamofire/4.7.3 unicom{version:${UnicomSMSLoginSession.VERSION}}"\n    }\n'''
          new = '''    fun captchaUserAgent(): String {\n        val deviceOS = captchaSystemInfo()["deviceOS"].orEmpty().ifBlank { "18.0" }\n        val systemToken = deviceOS.replace('.', '_')\n        return "Mozilla/5.0 (iPhone; CPU iPhone OS $systemToken like Mac OS X) " +\n            "AppleWebKit/605.1.15 (KHTML, like Gecko) unicom{version:${UnicomSMSLoginSession.VERSION}};" +\n            "ltst;OSVersion/$deviceOS"\n    }\n'''
          if old not in s:
              raise SystemExit('captchaUserAgent block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/clxmhcs/chinaunicom/ui/FlowViewModel.kt
          git commit -m "M5: match iOS captcha H5 user agent"
          git push origin HEAD:m5-sms-captcha-webview-parity
